  # ==========================================================
  # 第五部分: 查询 API
  # ==========================================================

  query_interface:
    methods:
      get_realm_info:
        params: [realm_name]
        returns: "境界详细信息（寿元/突破率/灵力需求）"

      get_spirit_root_info:
        params: [quality, attribute]
        returns: "灵根详细信息（上限/修炼倍率）"

      get_rule_pipeline:
        params: [pipeline_name]
        returns: "完整管线定义"

      get_validation_rules:
        params: [domain]
        returns: "该域的校验规则"

      get_adr:
        params: [adr_id]
        returns: "决策记录全文"

      search_concept:
        params: [keyword]
        returns: "所有提及该概念的文件和位置"

      get_version_diff:
        params: [old_version, new_version]
        returns: "版本间变更详情"

    response_format:
      success: bool
      data: any
      source: "引用来源文件"
      error: "null | string"
