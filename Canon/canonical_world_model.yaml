        - "练气"
        - "筑基"
        - "金丹"
        - "元婴"
        - "化神"
        - "炼虚"
        - "合体"
        - "大乘"
        - "渡劫"
        - "地仙"
        - "天仙"
        - "金仙"
        - "太乙金仙"
        - "大罗金仙"
        - "超脱"
