    spirit_roots:
      qualities: ["凡灵根", "黄灵根", "玄灵根", "地灵根", "天灵根", "仙灵根", "神灵根", "混沌灵根"]
      attributes: ["金", "木", "水", "火", "土", "风", "雷", "冰", "光", "暗", "时间", "空间", "生命", "死亡"]
      details: "Registry/SpiritRoot.yaml"

    breakthrough:
      conditions: ["灵气充足", "灵根上限", "寿元足够", "资源具备", "心境圆满"]
      pipeline: "rule_engine.yaml → breakthrough"
      details: "Registry/breakthrough.yaml"

    tribulation:
      triggers: "元婴境起每次大境界突破"
      types: ["雷劫", "火劫", "风劫", "心魔劫", "业火劫", "混沌劫"]
      pipeline: "rule_engine.yaml → tribulation"
      details: "Registry/tribulation.yaml"

    lifespan:
      details: "Registry/lifespan.yaml"

    dao:
      layers: ["大道法则", "天道规则", "本源之力"]
      details: "Registry/dao.yaml"

    weather:
      types: 12
      effects: "影响修炼效率、妖兽活动、灵药生长"
      details: "Registry/weather.yaml"

  # ==========================================================
  # 第三部分: 引擎规范 (来自 engine/*.yaml)
  # ==========================================================

  engines:
    rule_engine:
      source: "engine/rule_engine.yaml"
