# Canonical World Model
#
# Canon Loader 的输出——统一、可查询的世界模型。
# Hermes 回答任何世界问题时的唯一数据来源。

version: "1.0.0"
status: Canon
loaded_from: "canon_loader → 61 files → unified model"

---

canonical_world_model:

  meta:
    canon_version: "1.0.0"
    loaded_at: "2026-07-23"
    file_count: 61
    validation: { errors: 0, warnings: 3 }

  # ==========================================================
  # 第一部分: 世界规则 (来自 Volume I~II + Registry)
  # ==========================================================

  world_rules:
    cosmology:
      source: "Volume I"
      universe_origin: "混沌起源"
      cosmic_structure: "九天界 + 三层位面"
      dao_primacy: "大道 > 仙帝"

    physics:
      source: "Volume II"
      qi:
        unit: "灵气浓度 (0~1000)"
        flow: "高浓度 → 低浓度扩散"
      time:
