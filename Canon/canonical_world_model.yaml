      rules: 28
      severity_levels: ["BLOCK", "WARN", "INFO"]
      status: active

    world_kernel:
      source: "engine/world_kernel.yaml"
      components: ["scheduler", "state_manager", "event_bus", "validator", "snapshotter", "transaction_manager"]
      status: active

    world_state:
      source: "engine/world_state.yaml"
      domains: 10
      status: active

    capability:
      source: "engine/capability.yaml"
      levels: 7
      status: active

    plugin_system:
      source: "engine/plugin_system.yaml"
      built_in: 7
      extendable: 6
      status: active

    civilization:
      source: "engine/civilization_engine.yaml"
      pillars: ["long_term_goals", "institution", "succession", "collective_decision", "cultural_memory"]
      status: defined

    canon_loader:
      source: "canon_loader.yaml"
      steps: 8
      status: defined

  # ==========================================================
  # 第四部分: 决策记录 (来自 adr/*.md)
  # ==========================================================

  decisions:
    total: 11
    records:
      - id: "ADR-0001"
        title: "统一修炼体系"
        status: Accepted

      - id: "ADR-0002"
        title: "Canon 知识摄入系统"
