# Narrative Arc Composition
#
# 叙事弧——从因果链到可读故事的桥梁
# 剧情不是预写的。剧情是因果链的可视化。

version: "1.0"
status: Canon

---

# ============================================================
# 弧的定义
# ============================================================

arc:

  description: >
    一条因果链 + length ≥ 3 + total_importance ≥ 15
    → 自动提升为叙事弧。


  promotion:
    from: causal_chain
    conditions:
      - "length >= 3"
      - "total_importance >= 15"
    action: "创建 Arc 对象，分配 arc_id"

  lifecycle:
    states:
      emerging: "链长 1-2，尚未成弧"
      active: "链长 ≥ 3，正在展开"
      climax: "链中 importance 最高的事件（峰值）"
      resolution: "弧的自然终点事件"
      completed: "弧已完结，移入已完成弧列表"
    auto_detect:
      climax: "链中 max(importance) 的事件"
      resolution: "链末事件 或 重要性突然回落的点"

  parallel_arcs:
    description: 世界可以同时有多条叙事弧在运行
    management:
      - "每条弧独立推进"
      - "弧可以在交汇点合并（chain_merge）"
      - "弧可以分叉（一个事件触发两条新链）"
      - "主弧（importance 最高）优先级最高"

---

# ============================================================
# 弧 → 章 → 场景 的层次结构
# ============================================================

hierarchy:

  arc:
    contains: chapters
    description: "一整条因果链的叙事——例如'灵脉危机'"
    generation: "因果链的每一步 → 一个章"

  chapter:
    contains: scenes
    description: "因果链中一个事件的叙事——例如'弟子外出寻资源'"
    generation: "一个事件的多视角展开 → 多个场景"

  scene:
    contains: beats
    description: "单一视角的叙事——例如'弟子小队的视角'或'妖兽的视角'"
    generation: "narrative_schema.yaml 的 scene_template"

---

# ============================================================
# 多视角编织
# ============================================================

perspectives:

  omniscient:
    description: "全知视角 — 读者看到完整因果链"
    usage: "弧的开场章和终章（建立全局视野）"
    content:
      - "show: 完整事件序列 + 每步的因果关系"
      - "hide: NPC 内心活动（留给 NPC 视角）"
    example: >
      "青云宗的灵脉正在枯竭。三年前还充盈的灵气，
      如今降到了危险线以下。宗门不得不削减一切开支，
      并派出弟子四处寻找替代灵脉。
      但他们不知道，黑风岭的妖兽这个夏天正在迁徙……"

  npc_perspective:
    description: "NPC 视角 — 读者通过特定 NPC 的眼睛看事件"
    usage: "弧的核心章（建立情感连接）"
    rules:
      - "只展示该 NPC 参与的事件"
      - "展示该 NPC 的记忆回溯（memory→thought）"
      - "展示该 NPC 的未知（他们不知道的事 = 戏剧张力来源）"
    example: >
      "赵铁是青云宗外门弟子，入宗三年第一次被派外出任务。
      他只知道长老说'找到新灵脉'，
      不知道自家灵脉最多撑不过半年。
      他更不知道，黑风岭的妖狼今年比往年多了三倍。"

  player_perspective:
    description: "玩家视角 — 读者通过玩家的眼睛看事件"
    usage: "玩家进入弧的切入章"
    rules:
      - "只展示玩家可感知的信息"
      - "标记 [unknown] 玩家不知道的事"
      - "玩家选择 = 影响弧的走向"

  weaving_patterns:

    chain_growth:
      description: "逐步揭示因果链"
      pattern: >
        Chapter 1: 全知视角（根因）→ "灵脉正在枯竭"
        Chapter 2: NPC 视角（响应）   → "赵铁被派出寻资源"
        Chapter 3: NPC 视角（遭遇）   → "赵铁在黑风岭"
        Chapter 4: 全知视角（后果）   → "三大势力汇聚"
      effect: "读者先知道全局，再进入个体情感"

    mystery:
      description: "逐步揭示因果（侦探式）"
      pattern: >
        Chapter 1: NPC 视角 → 只看到结果（宗门削减开支）
        Chapter 2: NPC 视角 → 发现线索（灵脉异常）
        Chapter 3: 全知视角 → 揭示全貌（灵脉即将枯竭）
      effect: "读者和 NPC 同步发现真相"

    collision:
      description: "两条弧交汇"
      pattern: >
        Chapter 1-3: 弧 A 的视角
        Chapter 4-5: 弧 B 的视角
        Chapter 6: 双线交汇 → 两个 NPC 各看到一半真相
      effect: "读者看到双方视角的信息不对称"

---

# ============================================================
# 弧的叙事输出
# ============================================================

output:

  arc_header:
    fields:
      - arc_id
      - title: "从 root_event.title 推导"
      - status: "active/completed"
      - root_cause: "根因事件"
      - chain_length: "事件数"
      - total_importance: "重要性总和"

  chapter_structure:
    for_each_event:
      - event_summary: "事件标题 + 时间 + 地点"
      - causality: "为什么发生 → 触发什么"
      - key_participants: "涉及的主要 NPC/势力"
      - perspective_choice: "选择哪个视角（全知/NPC/玩家）"
      - scene_compose: "调用 narrative_schema.yaml scene_template"

  arc_timeline:
    description: "弧的时间线可视化"
    format: >
      天历847年1月 — 灵脉开始衰减（根因）
           ↓ [资源因果, conf=0.95]
      天历847年3月 — 青云宗减少弟子月俸
           ↓ [位置因果, conf=0.85]
      天历847年6月 — 赵铁小队出发黑风岭
           ↓ [位置因果 + 生态交叉, conf=0.88]
      天历847年7月 — 遭遇金瞳妖狼，发现古遗迹
           ↓ [信息因果, conf=0.90]
      天历847年7月 — 三大势力闻讯而动
