# Simulation Loop Specification
#
# 天道计划 — 世界模拟循环
# 每天（1 Tick = 1 世界日）执行一次完整 11 步循环
#
# 原则：
#   - 确定性：相同 seed + 相同状态 → 相同结果
#   - 不可跳过：任何一步都不能跳过
#   - 顺序不可变：每一步依赖上一步的输出
#   - 事件归集：所有状态变更统一在 Events 阶段处理

version: "1.0"
status: Canon

---

# ============================================================
# 全局设置
# ============================================================

simulation:
  tick_unit: "1 世界日"
  seed: null  # null = 随机，数字 = 可复现
  prng: "Mersenne Twister"
  tick_count: 0

---

# ============================================================
# Step 1: Time（推进时间）
# ============================================================

step_01_time:
  order: 1
  description: 推进世界时间 1 天

  input:
    current_time: from world_state.time
    time_scale: "1 tick = 1 世界日"

  processing:
    - action: 推进日期
      rule: "current_time + 1 day"
      special:
        month_end: 月末自动翻月
        year_end: 年末自动翻年（天历纪元）
        season_change: 按节气自动切换季节

    - action: 检查时间触发事件
      checks:
        - "是否有 NPC 寿元耗尽？（npc.age >= npc.max_lifespan）"
        - "是否有 NPC 突破时限到达？"
        - "是否有宗门定期活动？（年度大比、灵脉分配）"
        - "是否有季节性事件？（春天灵药生长、冬天妖兽冬眠）"

  output:
    updated_time: 新的世界时间
    time_events: [{ type: "season_change", detail: "..." }, ...]

---

# ============================================================
# Step 2: Weather（更新天气）
# ============================================================

step_02_weather:
  order: 2
  description: 根据季节+地形+灵气浓度决定天气

  input:
    season: from step_01 output
    location_qi_density: from world_state (上轮 Qi)
    terrain_type: from location data
    previous_weather: from world_state

  processing:
    - action: 为基础天气加权
      source: registry/weather.yaml
      rules:
        - "春季 + 平原 → 晴天(40%) 多云(30%) 细雨(20%) 雷暴(10%)"
        - "冬季 + 高山 → 暴雪(40%) 严寒(30%) 阴天(20%) 晴天(10%)"
        - "高灵气区域 → 灵气雾(20%加成)"
        - "天地异象 → 极小概率触发（1%）"

    - action: 天气持续性
      rule: >
        如果持续天数 < 天气最低持续天数 → 保持不变
        否则 → 重新计算

    - action: 天气影响标记
      effects:
        - "暴雪/雷暴 → NPC 行动范围缩小"
        - "灵气雾 → 修炼效率 +20%"
        - "大旱 → 灵药产量 -30%"

  output:
    weather_map: { location_id: weather_type, ... }
    weather_events: [{ type: "weather_change", location: "...", detail: "..." }]

---

# ============================================================
# Step 3: Qi（更新灵气）
# ============================================================

step_03_qi:
  order: 3
  description: 天气+灵脉 → 各地灵气浓度

  input:
    weather_map: from step_02 output
    spirit_veins: from world_state.spirit_veins
    season: from step_01 output

  processing:
    - action: 计算灵气基础值
      formula: >
        qi_density = vein.base_output
                   × weather_modifier
                   × season_modifier

      weather_modifier:
        灵气雾: 1.3
        晴天: 1.0
        阴天: 0.9
        暴雪: 0.7
        雷暴: 0.6

      season_modifier:
        春: 1.1
        夏: 1.2
        秋: 1.0
        冬: 0.8

    - action: 灵脉衰减/恢复
      rules:
        - "过度开采（提取量 > 恢复量）→ 灵脉品质降级风险"
        - "自然恢复 → 每 30 天恢复 1%（未开采状态）"

    - action: 灵气扩散
      rule: 灵脉周边 100 里的区域享受该灵脉的 50% 灵气加成

  output:
    qi_map: { location_id: qi_density, ... }
    qi_events: [{ type: "qi_change", location: "...", delta: "..." }]

---

# ============================================================
# Step 4: Ecology（更新生态）
# ============================================================

step_04_ecology:
  order: 4
  description: 灵气+季节 → 妖兽/灵药/生态链

  input:
    qi_map: from step_03 output
    season: from step_01 output
    creature_populations: from world_state

  processing:
    - action: 灵药生长
      rules:
        - "灵气越高 → 灵药生长越快"
        - "春季 → 生长 +30%"
        - "冬季 → 生长 -50%（除非有温室/洞天）"
        - "过度采集 → 品质退化"

    - action: 妖兽繁殖/迁徙
      rules:
        - "妖兽数量随灵气+食物链波动"
        - "冬季 → 高阶妖兽冬眠，低阶妖兽迁徙"
        - "食物不足 → 妖兽可能攻击人类聚居地"

    - action: 生态事件检测
      checks:
        - "妖兽数量 > 阈值 → 兽潮风险"
        - "灵药绝迹 → 丹药价格飙升"

  output:
    ecology_state: { location: { herbs, beasts, balance }, ... }
    ecology_events: [{ type: "beast_tide_warning", location: "...", ... }]

---

# ============================================================
# Step 5: NPC（更新 NPC）
# ============================================================

step_05_npc:
  order: 5
  description: 最复杂的步骤——NPC 修炼、行动、记忆衰减、行为决策

  input:
    weather_map: from step_02
    qi_map: from step_03
    ecology_state: from step_04
    all_npcs: from world_state
    knowledge_graph: from world_state

  processing:
    for_each_npc:
      - action: memory_tick
        pipeline: rule_engine.yaml → actions.memory.on_tick
        details:
          - 衰减行为标签 intensity
          - 清除 intensity <= 0 的标签
          - 清理超过 30 天的短期记忆
          - 从长期记忆重建 active_tags

      - action: cultivation_progress
        formula: >
          daily_progress = base_rate
                         × spirit_root.multiplier
                         × qi_density / 100
                         × (1 + dao_comprehension × 0.01)
          cultivation_value += daily_progress
        
        breakthrough_check:
          condition: cultivation_value >= current_realm.threshold
          action: 触发突破判定（见 breakthrough pipeline）

      - action: daily_action
        description: NPC 选择每日行动
        rules:
          - "优先完成 active_tags 驱动的高优先级目标"
          - "若无事 → 默认修炼"
          - "若有 TRAUMATIZED 标签 → 可能回避特定地点/人物"
          - "若有 SEEKS_REVENGE → 寻找目标"

      - action: location_change
        description: NPC 可能移动到新地点
        rules:
          - "AVOIDS 标签 → 绕开特定地点"
          - "SEARCHING 标签 → 向目标移动"
          - "正常 → 在宗门/常驻地周围活动"

      - action: encounter_detection
        description: 检测是否与其他 NPC 在同一地点
        on_encounter:
          action: 触发 on_encounter pipeline
          pipeline: rule_engine.yaml → actions.memory.on_encounter

  output:
    updated_npcs: [所有 NPC 更新后的状态]
    npc_events: [
      { type: "breakthrough_attempt", npc: "...", target_realm: "..." },
      { type: "encounter", participants: ["npc_001", "npc_002"], location: "...", behavior: "..." },
      { type: "cultivation_progress", npc: "...", delta: "..." },
      ...
    ]

---

# ============================================================
# Step 6: Faction（更新宗门）
# ============================================================

step_06_faction:
  order: 6
  description: 宗门基于资源和目标做出决策

  input:
    factions: from world_state
    faction_members: from step_05 output (NPC 更新)
    economy_data: from world_state (上轮经济)

  processing:
    for_each_faction:
      - action: resource_accounting
        description: 统计宗门本日资源变化
        items: [灵石收入, 丹药消耗, 弟子月俸, 灵脉产出]

      - action: goal_evaluation
        description: 评估宗门当前目标进展
        checks:
          - "扩张目标：是否达到人数/领土阈值？"
          - "复仇目标：敌对势力是否被削弱？"
          - "生存目标：资源是否低于警戒线？"

      - action: decision_making
        rules:
          - "资源充足 + 扩张目标 → 招收弟子/扩张领土"
          - "敌对接壤 + 军力优势 → 可能宣战"
          - "资源不足 → 缩减开支/寻找新灵脉"
          - "内部矛盾 → 派系斗争概率增加"

      - action: member_management
        rules:
          - "弟子突破 → 提升地位"
          - "弟子死亡/叛逃 → 记录并触发相关 NPC 反应"
          - "长老更替 → 影响势力内部权力格局"

  output:
    updated_factions: [所有宗门更新后的状态]
    faction_events: [
      { type: "war_declaration", from: "...", to: "...", reason: "..." },
      { type: "recruitment", faction: "...", count: N },
      { type: "resource_crisis", faction: "...", detail: "..." },
      ...
    ]

---

# ============================================================
# Step 7: Economy（更新经济）
# ============================================================

step_07_economy:
  order: 7
  description: 供需驱动的价格更新

  input:
    resource_production: from step_04 + step_06
    resource_consumption: from step_05 + step_06
    trade_routes: from knowledge_graph (TRADES_WITH edges)
    weather_map: from step_02

  processing:
    - action: price_update
      formula: >
        price = base_price
              × (demand / supply)
              × transport_modifier
              × season_modifier

      transport_modifier:
        "正常商路": 1.0
        "商路被切断/战争": 2.0-5.0
        "天气恶劣（暴雪封路）": 1.5

    - action: resource_flow
      description: 资源沿商路流动
      rules:
        - "灵脉产出的灵石 70% 归控制宗门"
        - "丹药在坊市流通，价格浮动"
        - "稀有材料只在高阶拍卖会出现"

  output:
    price_table: { item_id: price, ... }
    economy_events: [{ type: "price_spike", item: "...", cause: "..." }]

---

# ============================================================
# Step 8: War（更新战争）
# ============================================================

step_08_war:
  order: 8
  description: 处理进行中的战争/冲突

  input:
    active_wars: from world_state
    faction_states: from step_06 output
    weather_map: from step_02

  processing:
    for_each_war:
      - action: battle_simulation
        description: 如果双方军队在同一区域，发生战斗
        factors:
          - 兵力对比
          - 高阶修士数量
          - 地形优势
          - 天气影响
          - 灵脉加成（守方）

      - action: territory_change
        description: 战斗结果 → 领土变更

      - action: peace_evaluation
        description: 是否触发和谈
        conditions:
          - "一方损失 > 50% 战力"
          - "一方资源耗尽"
          - "第三方调停"

  output:
    war_updates: [每个战争的进展]
    war_events: [{ type: "battle", participants: [...], result: "...", casualties: [...] }]

---

# ============================================================
# Step 9: Events（生成事件）
# ============================================================

step_09_events:
  order: 9
  description: >
    收集 Step 1-8 产生的所有原始事件，
    去重、合并、添加记忆、同步 KG、驱动叙事。

  input:
    raw_events: [来自 Step 1-8 的 events 数组]

  processing:
    - action: deduplicate
      description: 合并针对同一目标的重复事件

    - action: assign_importance
      description: 为每个事件计算重要性（用于 NPC 记忆）

    - action: create_memories
      pipeline: rule_engine.yaml → actions.memory.on_event
      description: >
        为每个事件涉及的 NPC 创建记忆条目。
        短期记忆 + 重要性 ≥ 5 的晋升长期记忆。

    - action: sync_knowledge_graph
      pipeline: knowledge_graph.yaml → graph_maintenance.on_memory_event
      description: 更新关系边

    - action: generate_narrative
      pipeline: narrative_schema.yaml → narrative_pipeline
      description: >
        对于重要性足够高的事件（imp ≥ 7），
        生成叙事场景（scene/beat）。

  output:
    processed_events: [完整事件列表，每个附记忆条目和 KG 变更]
    narrative_scenes: [新生成的叙事场景]

---

# ============================================================
# ╔══════════════════════════════════════╗
# ║  CANON VALIDATOR（校验关卡）       ║
# ║  所有内容必须通过此关卡才能写入历史 ║
# ╚══════════════════════════════════════╝
# ============================================================

step_09b_validator:
  order: "9.5"
  description: >
    对所有 Step 9 产出的内容执行 6 域校验。
    违规 → 自动修复 → 重新校验。
    3 次失败 → 暂停模拟。

  source: canon_validator.yaml

  processing:
    - action: pre_check
      scope: "新事件 + 新记忆 + KG 变更"
      domains: [domain_01, domain_02, domain_03, domain_05]
      on_BLOCK:
        - "撤回违规事件"
        - "生成修正事件"
        - "重新运行 Step 9（仅该事件）"
        - "重新校验"
      on_WARN:
        - "记录警告"
        - "事件通过"
      max_retries: 3

    - action: post_check
      scope: "叙事输出 + 完整世界状态"
      domains: [domain_01, domain_02, domain_03, domain_04, domain_05, domain_06]
      on_BLOCK:
        - "标记叙事段落为 [rejected]"
        - "用 beat 替代完整场景"
        - "重新生成叙事"
      on_WARN:
        - "叙事中标注 [disputed]"
        - "叙事通过"

    - action: log
      description: 写入 validator_log
      format: canon_validator.yaml → log_format

  output:
    validated_events: [通过校验的最终事件列表]
    validated_narrative: [通过校验的最终叙事输出]
    validator_log: [本次校验日志]

---

# ============================================================
# Step 10: History（记录历史）
# ============================================================

step_10_history:
  order: 10
  description: 事件写入历史记录。不可修改。不可删除。

  input:
    processed_events: from step_09
    tick_count: from simulation state

  processing:
    - action: append_to_history
      format:
        tick: tick_count
        timestamp: world_time
        events: [事件列表]
        state_changes: [状态变更摘要]
      storage: "追加写入，不可覆盖"

  output:
    history_entry: 本次 Tick 的历史记录（已持久化）

---

# ============================================================
# Step 11: Snapshot（保存快照）
# ============================================================

step_11_snapshot:
  order: 11
  description: 保存全量世界状态快照。只允许新增，不覆盖历史快照。

  input:
    full_world_state: 所有子系统更新后的状态
    tick_count: from simulation state
    seed: from simulation state

  processing:
    - action: serialize
      description: 序列化完整世界状态
      format: YAML（人类可读）
      includes:
        - world_time
        - tick_count
        - seed
        - all_npcs (含 memory)
        - all_factions
        - all_locations (含 qi_map)
        - price_table
        - active_wars
        - knowledge_graph

    - action: save
      path: "world/snapshots/tick_{tick_count}_{date}.yaml"
      rule: 只允许新增，不得覆盖

  output:
    snapshot_file: 快照文件路径
