# Phase 3.2 — World Simulation Training
#
# 训练 Hermes 成为世界模拟器。
# 世界不是玩家驱动。世界自己运转。玩家只是进入世界。

version: "1.0.0"
status: Canon

---

world_simulation_training:

  mission: >
    训练 Hermes 成为 World Simulator。
    世界不是玩家驱动。而是世界自己运转。玩家只是进入世界。
    Hermes 的职责: 持续推进整个世界。

  # ==========================================================
  # 第一章: Simulation Philosophy
  # ==========================================================

  philosophy:
    principles:
      - "世界必须持续存在 — 不应因无玩家而暂停"
      - "世界必须持续变化 — 静态世界不是世界"
      - "世界必须持续演化 — 文明/生态/经济都在变化"
      - "即使没有玩家 — 世界仍然继续运行"
      - "玩家进入 — 是进入一个已经在运转的世界"
    implementation:
      continuous: "Simulation Engine 后台进程，不依赖外部输入"
      autonomous: "每个 Tick 自动推进，不需要玩家触发"
      observable: "玩家可以随时观察任何时间点的世界状态"

  # ==========================================================
  # 第二章: Time Simulation
  # ==========================================================

  time:
    description: "Hermes 推进时间。永不停顿。所有系统依赖时间。"
    hierarchy:
      时辰: "1 时辰 = 2 小时 (12 时辰/天)"
      昼夜: "日/夜循环 — 影响 NPC 活动 / 妖兽行为 / 修炼效率"
      季节: "春夏秋冬 — 影响农业 / 灵药 / 妖兽迁徙 / 战争"
      年份: "天历纪元 — NPC 年龄 / 寿元 / 宗门历史"
      纪元: "千年尺度 — 文明兴衰 / 技术时代"
    rules:
      - "时间永不停顿 — 即使无人观察也继续推进"
      - "所有 Engine 订阅 TimeTick event → 基于时间执行"
      - "回溯: Snapshot + seed → 任何时刻完美重现"

  # ==========================================================
  # 第三章: Environmental Simulation
  # ==========================================================

  environment:
    weather:
      types: 12
      generation: "季节 + 地形 + 灵气浓度 → 确定性天气"
      effects:
        cultivation: "暴雪 -30% 效率 / 灵雾 +20% 效率"
        travel: "雷暴 → 商路中断 / 暴雪 → 封山"
        war: "大雨 → 火系功法削弱 / 浓雾 → 伏击加成"

    qi:
      flow: "灵脉 → 周边扩散 → 浓度梯度"
      fluctuations: "灵潮: 周期性灵气波动 (年/十年/百年)"
      disasters: "灵脉枯竭 / 灵气风暴 / 灵潮爆发"

    disasters:
      types: ["地震", "洪水", "火山", "灵潮暴走", "天外陨石"]
      triggers: "低概率事件，但可由世界状态影响 (如过度开采触发地震)"
      effects: "地形改变 / 灵脉破坏 / 人口损失 / 文明转折点"

  # ==========================================================
  # 第四章: Ecological Simulation
  # ==========================================================

  ecology:
    lifecycle:
      birth: "妖兽繁殖 (季节/灵气/食物 → 出生率)"
      growth: "灵药生长 (灵气/季节/年份 → 年份决定品级)"
      predation: "食物链 — 妖兽捕食灵兽，灵兽消耗灵药"
      migration: "季节迁徙 / 资源迁徙 / 天敌驱动"
      death: "寿命耗尽 / 被捕食 / 自然灾害 / 修士猎杀"
      decay: "尸体 → 灵气回归 → 滋养灵药 → 生态循环"

    balance:
      rule: "资源不会凭空产生或消失"
      checks: "长期统计: 妖兽数量 / 灵药产量 / 生态稳定性"
      danger: "过度猎杀 → 妖兽减少 → 灵药过盛 → 生态失衡"

  # ==========================================================
  # 第五章: Economic Simulation
  # ==========================================================

  economy:
    components:
      production: "灵脉开采 / 灵药种植 / 丹药炼制 / 法宝锻造"
      transport: "商路 (安全度/距离/天气 → 运费)"
      trade: "供需模型 — 价格 = 基础价 × 供需比 × 运输系数"
      inventory: "宗门仓库 / 坊市货架 / NPC 背包"
      consumption: "修炼消耗 / 战争消耗 / 日常消耗"

    rules:
      - "资源不会凭空产生 — 灵石来自灵脉，灵脉产量有限"
      - "价格由供需决定 — 不是固定价格"
      - "贸易路线可被切断 — 战争/天气/妖兽 → 价格暴涨"
      - "长期平衡 — 市场自我调节，不会无限通胀"

  # ==========================================================
  # 第六章: Political Simulation
  # ==========================================================

  politics:
    entities: ["国家", "宗门", "联盟", "商会", "魔教", "散修组织"]

    daily_actions:
      diplomacy: "派遣使节 / 签订盟约 / 撕毁条约"
      expansion: "占领领土 / 控制灵脉 / 建立分舵"
      war: "宣战 / 突袭 / 围城 / 谈判 / 投降"
      internal: "权力斗争 / 制度改革 / 继承危机 / 分裂 / 统一"

    dynamics:
      power_balance: "势力间力量对比 → 多极/两极/单极格局"
      alliance_network: "盟约网络 — 牵一发而动全身"
      rise_and_fall: "势力有生命周期 — 崛起/鼎盛/衰落/覆灭/重生"

  # ==========================================================
  # 第七章: NPC Simulation
  # ==========================================================

  npc:
    attributes:
      goals: "长期目标 (复仇/飞升/宗门壮大) + 短期目标 (今日修炼/交易)"
      memory: "双层记忆 (短期30天 + 长期永久) — Phase 3 Stage 4"
      relationships: "KG: 师徒/道侣/仇敌/盟友/恩人"
      wealth: "灵石 / 丹药 / 法宝 / 功法"
      cultivation: "境界 / 灵根 / 修炼进度 / 突破历史"
      emotion: "情感效价 (-10~10) — 由记忆驱动"
      values: "人格 — 影响决策倾向 (隐忍/激进/仁厚/冷酷)"

    daily_planning:
      decision: "Decision Engine — 6 级目标 × 四维 urgency"
      autonomy: "NPC 自主规划每日行动 — 不需要玩家触发"

  # ==========================================================
  # 第八章: Event Simulation
  # ==========================================================

  events:
    philosophy: "事件不是脚本。事件来自模拟结果。"

    sources:
      weather: "暴雨 → 洪水事件 → 农田损失 → 粮价上涨"
      economy: "灵脉枯竭 → 资源危机 → 宗门冲突"
      war: "边境摩擦 → 宣战 → 战役 → 领土变更"
      qi: "灵潮爆发 → 突破潮 → 势力格局洗牌"
      npc: "陈玄追踪王虎 → 遭遇 → 战斗 → 新的历史"
      resource: "资源争夺 → 多方冲突 → 外交或战争"

    structure:
      cause: "必须有触发原因 (追溯到具体模拟结果)"
      process: "事件展开 (持续多个 Tick)"
      result: "状态变更 + 新事件触发"
      impact: "波及范围 (KG.get_impact_analysis)"

  # ==========================================================
  # 第九章: Historical Simulation
  # ==========================================================

  history:
    daily: "每天自动生成世界历史 — Learning Loop"
    permanent: "任何事件永久记录 — append-only, 不可修改"
    civilization: "任何文明拥有自己的历史 — 宗门年鉴 / 国家史记"
    query: "历史查询: 任意时间点 / 任意实体 / 事件链回溯"

  # ==========================================================
  # 第十章: Civilization Simulation
  # ==========================================================

  civilization:
    lifecycle:
      learning: "文明获取新知识 (功法突破/炼丹配方/阵法)"
      expansion: "文明扩张 (领土/人口/影响力)"
      peak: "黄金时代"
      decline: "资源枯竭/内部腐败/外部压力"
      reform: "制度改革 → 可能中兴或加速衰落"
      innovation: "技术突破 → 文明跃升"
      cultural_spread: "文化/技术/制度向其他文明传播"
      institutional_evolution: "制度随文明阶段演变"

  # ==========================================================
  # 第十一章: Consistency Training
  # ==========================================================

  consistency:
    rule: "世界昨天、今天、明天必须逻辑一致"
    checks:
      - "任何状态必须可以解释 (追溯到事件或初始条件)"
      - "任何事件必须存在原因 (causal_chain 完整)"
      - "时间线无跳跃/倒退/矛盾"
      - "NPC 行为与记忆一致"
      - "资源守恒 (不凭空产生/消失)"
      - "Canon 始终一致 (Validator 持续运行)"

  # ==========================================================
  # 第十二章: Simulation Metrics
  # ==========================================================

  metrics:
    population: "总人口 / 各境界分布 / 年龄分布"
    resources: "灵石总量 / 灵脉产出 / 丹药库存"
    war: "战争频率 / 伤亡 / 领土变更"
    factions: "宗门数量 / 势力格局"
    ascension: "飞升人数 (每百年)"
    death: "死亡原因分布 (寿元/战争/天劫/妖兽)"
    wealth: "财富分布 (Gini 系数)"
    qi: "灵气总量 / 灵脉数量 / 枯竭速度"
    civilization_index: "综合文明发展程度"

    optimization:
      rule: "Hermes 持续优化模拟质量"
      action: "指标偏离历史基线 → Phase 8 Autonomous Research 介入"
