<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>天道 — Project Celestial 3D</title>

<div id="top-hud"><div id="tick">Tick: 0</div><div id="ent">Entities: 0</div><div id="zone">Zone: --</div></div>
<div id="region-label"></div>
<div id="bottom-hud">
  <div id="hp-bar"><div id="hp-fill"></div><div id="hp-text"></div></div>
  <div id="qi-bar"><div id="qi-fill"></div><div id="qi-text"></div></div>
  <div id="skill-bar"><div class="skill-slot">⚔</div><div class="skill-slot">🗡</div><div class="skill-slot">🛡</div></div>
  <div id="inv-bar">🎒 空</div>
  <div id="action-bar" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:50">
    <button class="abtn" onclick="doCultivateAction('risky')" style="background:#c0392b;color:#fff;border:0;padding:8px 14px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold">⚡ 冒险修炼</button>
    <button class="abtn" onclick="doCultivateAction('normal')" style="background:#2980b9;color:#fff;border:0;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:10px">✦ 普通修炼</button>
    <button class="abtn" onclick="doRest()" style="background:#27ae60;color:#fff;border:0;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:10px">🛌 休息</button>
    <button class="abtn" onclick="doExploreAt()" style="background:#f39c12;color:#000;border:0;padding:8px 14px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold">🔍 探索</button>
    <button class="abtn" onclick="doGather('spirit_grass')" style="background:#8e44ad;color:#fff;border:0;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:10px">🌿 采集灵草</button>
    <button class="abtn" onclick="doBreakthrough()" style="background:#f1c40f;color:#000;border:0;padding:8px 14px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold">💫 突破</button>
  </div>
</div>
<div id="log"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const BASE='http://localhost:3000';
const AREA_OFFSETS={area_bamboo_grove:[0,0],area_misty_peak:[30,20],area_thunder_valley:[60,0],area_dragon_vein:[90,-10]};

// ══════════════════════════════════════
// Entity Visual Profiles (Renderer-owned, Runtime never imports)
// Runtime says: "entity type=spirit_wolf at area X"
// Renderer decides: spirit_wolf → dark box, 1.5x size, eye glow
// ══════════════════════════════════════
const ENTITY_VISUALS={
  // Player
  player:{ shape:"humanoid", color:0x4488ff, size:1.0, emissive:0x112244, name:"修士" },

  // Monsters
  wild_beast:    { shape:"box",      color:0x884422, size:1.2, emissive:0x221100, name:"野兽" },
  spirit_wolf:   { shape:"box",      color:0x555566, size:1.5, emissive:0x111122, name:"灵狼",  eyes:0xffffff },
  thunder_eagle: { shape:"flat",     color:0xccaa44, size:1.0, emissive:0x332200, name:"雷鹰",  eyes:0xffff00 },
  demon_serpent: { shape:"long",     color:0x225522, size:1.0, emissive:0x112211, name:"魔蛇",  eyes:0xff0000 },
  ancient_guard: { shape:"big",      color:0x666644, size:2.0, emissive:0x333322, name:"古卫",  eyes:0xff8800 },
  boss_wyrm:     { shape:"tall",     color:0x993322, size:2.5, emissive:0x441100, name:"龙蟒",  eyes:0xff0000, crown:true },
  shadow_dragon: { shape:"tall",     color:0x221133, size:3.0, emissive:0x110022, name:"影龙",  eyes:0xff00ff, crown:true },

  // NPC
  npc:{ shape:"humanoid", color:0x44ff44, size:0.9, emissive:0x112211, name:"修士" },
};

// ══════════════════════════════════════
// Region Visual Profiles (Renderer-owned, Runtime never imports)
// ══════════════════════════════════════
const REGION_VISUALS={
  area_bamboo_grove:{zone:"翠竹林",ground:0x225522,sky:0x6688aa,fog:0x6688aa,fogNear:30,fogFar:150,ambient:0x446644,ambientI:1.0,sun:0xffeedd,sunI:2.0,trees:60,treeColor:0x228833,rockColor:0x556633,grassColor:0x33aa44},
  area_misty_peak:  {zone:"云雾峰",ground:0x555544,sky:0x8899bb,fog:0xaabbcc,fogNear:20,fogFar:120,ambient:0x667788,ambientI:1.5,sun:0xffffff,sunI:1.5,trees:40,treeColor:0x337744,rockColor:0x777766,grassColor:0x779955},
  area_thunder_valley:{zone:"雷音谷",ground:0x443344,sky:0x332244,fog:0x554466,fogNear:15,fogFar:100,ambient:0x554466,ambientI:1.0,sun:0xccaaff,sunI:1.8,trees:30,treeColor:0x335533,rockColor:0x554466,grassColor:0x446644},
  area_dragon_vein:  {zone:"龙脉秘境",ground:0x332211,sky:0x443322,fog:0x996633,fogNear:25,fogFar:180,ambient:0x664422,ambientI:1.3,sun:0xffcc88,sunI:2.2,trees:50,treeColor:0x447722,rockColor:0x665544,grassColor:0x558844},
};

// ── Scene ──
const scene=new THREE.Scene();
let currentRegion=null;
const envMeshes=[];

function applyRegionVisuals(regionId){
  const v=REGION_VISUALS[regionId]||REGION_VISUALS.area_bamboo_grove;
  if(currentRegion===regionId)return;
  currentRegion=regionId;

  // Sky + Fog
  scene.background=new THREE.Color(v.sky);
  scene.fog=new THREE.Fog(v.fog,v.fogNear,v.fogFar);

  // Lighting
  scene.children.filter(c=>c.isLight).forEach(c=>scene.remove(c));
  scene.add(new THREE.AmbientLight(v.ambient,v.ambientI));
  const sun=new THREE.DirectionalLight(v.sun,v.sunI);
  sun.position.set(30,50,20);sun.castShadow=true;scene.add(sun);

  // Clear old terrain
  envMeshes.forEach(m=>{scene.remove(m);if(m.geometry)m.geometry.dispose();if(m.material)m.material.dispose()});
  envMeshes.length=0;

  // Ground
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:v.ground,roughness:0.9}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);envMeshes.push(ground);

  // Rocks
  for(let i=0;i<15;i++){
    const rx=(Math.random()-0.5)*160,rz=(Math.random()-0.5)*160;
    const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(0.8+Math.random()*1.5,0),new THREE.MeshStandardMaterial({color:v.rockColor,roughness:0.8}));
    rock.position.set(rx,0.3,rz);rock.castShadow=true;rock.receiveShadow=true;
    scene.add(rock);envMeshes.push(rock);
  }

  // Trees
  for(let i=0;i<v.trees;i++){
    const x=(Math.random()-0.5)*160,z=(Math.random()-0.5)*160;
    const tree=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,3),new THREE.MeshStandardMaterial({color:0x553311}));
    trunk.position.y=1.5;
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(1.5,4,6),new THREE.MeshStandardMaterial({color:v.treeColor}));
    leaf.position.y=4;
    tree.add(trunk);tree.add(leaf);
    tree.position.set(x,0,z);tree.castShadow=true;tree.userData.tree=true;
    scene.add(tree);envMeshes.push(tree);
  }

  // Grass patches
  for(let i=0;i<200;i++){
    const x=(Math.random()-0.5)*160,z=(Math.random()-0.5)*160;
    const grass=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.5+Math.random()*0.5,3),new THREE.MeshStandardMaterial({color:v.grassColor}));
    grass.position.set(x,0.2,z);
    scene.add(grass);envMeshes.push(grass);
  }

  // Region name label
  document.getElementById('region-label').textContent=v.zone;
  document.getElementById('region-label').style.opacity='1';
  setTimeout(()=>{document.getElementById('region-label').style.opacity='0';},2000);

  // Log
  document.getElementById('log').innerHTML='🌲 进入 '+v.zone;
}

// ── Camera ──
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,500);
camera.position.set(20,30,40);

// ── Renderer ──
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

// ── Entity meshes — type-driven visuals ──
const meshes=new Map();
function createMesh(type,id,entityType){
  const v=ENTITY_VISUALS[entityType||type]||ENTITY_VISUALS.npc;
  const s=v.size||1;
  const group=new THREE.Group();
  group.userData={id,type:entityType||type,visual:v};

  switch(v.shape){
    case "humanoid":{
      const body=new THREE.Mesh(new THREE.BoxGeometry(0.8*s,1.2*s,0.6*s),new THREE.MeshStandardMaterial({color:v.color,roughness:0.4}));
      body.position.y=1.0*s;body.castShadow=true;
      const head=new THREE.Mesh(new THREE.SphereGeometry(0.35*s,6,4),new THREE.MeshStandardMaterial({color:v.color,roughness:0.3}));
      head.position.y=1.8*s;
      group.add(body);group.add(head);
      break;
    }
    case "box":
      group.add(new THREE.Mesh(new THREE.BoxGeometry(1.2*s,1.2*s,1.2*s),new THREE.MeshStandardMaterial({color:v.color,roughness:0.6,emissive:v.emissive,emissiveIntensity:0.3})));
      break;
    case "flat":
      group.add(new THREE.Mesh(new THREE.BoxGeometry(2*s,0.6*s,1.2*s),new THREE.MeshStandardMaterial({color:v.color,roughness:0.6,emissive:v.emissive,emissiveIntensity:0.3})));
      break;
    case "long":
      group.add(new THREE.Mesh(new THREE.BoxGeometry(0.8*s,0.8*s,2.5*s),new THREE.MeshStandardMaterial({color:v.color,roughness:0.6,emissive:v.emissive,emissiveIntensity:0.3})));
      break;
    case "big":
      group.add(new THREE.Mesh(new THREE.BoxGeometry(1.8*s,2*s,1.8*s),new THREE.MeshStandardMaterial({color:v.color,roughness:0.7,emissive:v.emissive,emissiveIntensity:0.2})));
      break;
    case "tall":{
      const body=new THREE.Mesh(new THREE.CylinderGeometry(0.8*s,1.0*s,3*s,8),new THREE.MeshStandardMaterial({color:v.color,roughness:0.5,emissive:v.emissive,emissiveIntensity:0.4}));
      body.position.y=1.5*s;body.castShadow=true;
      group.add(body);
      // Crown ring for bosses
      if(v.crown){
        const ring=new THREE.Mesh(new THREE.TorusGeometry(1.0*s,0.15*s,8,16),new THREE.MeshStandardMaterial({color:0xffaa00,emissive:0xff6600,emissiveIntensity:0.8}));
        ring.position.y=3.1*s;ring.rotation.x=Math.PI/2;
        group.add(ring);
      }
      break;
    }
  }

  // Eye glow
  if(v.eyes){
    const eyeGeo=new THREE.SphereGeometry(0.15*s,4,4);
    const eyeMat=new THREE.MeshStandardMaterial({color:v.eyes,emissive:v.eyes,emissiveIntensity:1.5});
    const left=new THREE.Mesh(eyeGeo,eyeMat);left.position.set(-0.3*s,0,0.6*s);group.add(left);
    const right=new THREE.Mesh(eyeGeo,eyeMat);right.position.set(0.3*s,0,0.6*s);group.add(right);
  }

  group.castShadow=true;group.receiveShadow=true;
  scene.add(group);
  meshes.set(id,group);
  return group;
}

// ── Runtime Bridge ──
let lastTick=0,lastArea=null,playerCreated=false;
async function syncWorld(){
  try{
    // Auto-create player if none exists
    if(!playerCreated){
      try{
        const check=await (await fetch(BASE+'/api/game/player')).json();
        if(!check.player||!check.player.name){
          await fetch(BASE+'/api/game/player/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'云游道人'})});
        }
        playerCreated=true;
      }catch(e){console.error('player create fail:',e.message)}
    }
    const w=await (await fetch(BASE+'/api/world')).json();
    document.getElementById('tick').textContent='Tick: '+w.tick;
    document.getElementById('ent').textContent='Ent: '+w.entities;
    document.getElementById('zone').textContent='Qi: '+(w.qi||0).toFixed(2);

    const player=await (await fetch(BASE+'/api/game/player')).json();
    const pData=player.player||player;

    // Region change detection
    if(pData){
      const area=pData.current_area||pData.area;
      if(area&&area!==lastArea){
        lastArea=area;
        applyRegionVisuals(area);
      }
    }

    // Player mesh
    if(pData&&pData.name){
      let pm=meshes.get('player');
      if(!pm)pm=createMesh('player','player');
      // Position from player's actual location
      const pArea=pData.current_area||pData.area||'area_bamboo_grove';
      const offset=AREA_OFFSETS[pArea]||[0,0];
      const px=(pData.x||0)+(offset[0]);
      const pz=(pData.y||0)+(offset[1]);
      pm.position.set(px,1,pz);
    }
    // NPCs
    const npcs=await (await fetch(BASE+'/api/npcs')).json();
    const aliveIds=new Set(['player']);
    for(const n of (Array.isArray(npcs)?npcs:[])){
      aliveIds.add(n.id||n.entityId);
      let m=meshes.get(n.id||n.entityId);
      if(!m)m=createMesh('npc',n.id||n.entityId,'npc');
      const offset=AREA_OFFSETS[n.area||lastArea||'area_bamboo_grove']||[0,0];
      m.position.set(offset[0]+(Math.random()-0.5)*8,0,offset[1]+(Math.random()-0.5)*8);
    }

    // Update HUD
    if(pData){
      const hp=pData.hp_current||100,hpmax=pData.hp_max||100;
      document.getElementById('hp-fill').style.width=(hp/hpmax*100)+'%';
      document.getElementById('hp-text').textContent='❤ '+hp+'/'+hpmax;
      document.getElementById('qi-fill').style.width='100%';
      document.getElementById('qi-text').textContent='💠 '+((pData.qi||50))+'/'+((pData.qi_max||50));
      // Inventory
      const inv=pData.inventory||{};
      const names={spirit_herb:'灵草',jade_shard:'灵石碎片',spirit_stone:'灵石',ancient_jade:'古玉',dragon_scale:'龙鳞',thunder_ore:'雷晶'};
      const entries=Object.entries(inv).filter(([k])=>names[k]||k.startsWith('pill_')).slice(0,3);
      document.getElementById('inv-bar').textContent=entries.length?'🎒 '+entries.map(([k,v])=>(names[k]||k)+'x'+v).join(' '):'🎒 空';
    }

    // Monsters
    const monsters=await (await fetch(BASE+'/api/npcs')).json();
    // We read monster types from world state — for now use NPCs only
    // Future: /api/monsters endpoint

    for(const[id,m] of meshes){if(!aliveIds.has(id)&&id!=='player'){scene.remove(m);meshes.delete(id);}}

    if(w.tick!==lastTick){lastTick=w.tick;}
  }catch(e){console.error('sync:',e.message)}
}

async function sendMove(dx,dy){
  try{await fetch(BASE+'/api/game/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dx,dy})});}catch(e){}
}

// ── WASD Controller ──
const keys={};let playerX=0,playerZ=0;
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='e'){
    e.preventDefault();
    const pm=meshes.get('player');
    if(pm)doExploreAt(pm.position);
  }
  if(e.key.toLowerCase()==='i'){
    e.preventDefault();
    toggleInventory();
  }
  if(e.key.toLowerCase()==='c'){
    e.preventDefault();
    doCultivate();
  }
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function processInput(){
  const speed=0.3;
  if(keys['w']||keys['arrowup'])    sendMove(0,-1);
  if(keys['s']||keys['arrowdown'])  sendMove(0,1);
  if(keys['a']||keys['arrowleft'])  sendMove(-1,0);
  if(keys['d']||keys['arrowright']) sendMove(1,0);
}
setInterval(processInput,150);

// P5 — Combat Visual Effects
const damageNumbers=[];
let particles=[];
function showDamage(pos,amount,critical){
  const canvas=document.createElement('canvas');canvas.width=128;canvas.height=64;
  const ctx=canvas.getContext('2d');
  ctx.font=`bold ${critical?'28':'22'}px system-ui`;
  ctx.fillStyle=critical?'#ff0':'#f44';ctx.strokeStyle='#000';ctx.lineWidth=3;
  ctx.textAlign='center';ctx.strokeText((critical?'💥':'')+amount,64,40);
  ctx.fillText((critical?'💥':'')+amount,64,40);
  const tex=new THREE.CanvasTexture(canvas);
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true,opacity:1});
  const sprite=new THREE.Sprite(mat);sprite.scale.set(4,2,1);
  sprite.position.copy(pos).add(new THREE.Vector3(0,2.5,0));
  scene.add(sprite);damageNumbers.push({sprite,time:2});
}
function showDeathEffect(pos,color){
  for(let i=0;i<8;i++){
    const geo=new THREE.SphereGeometry(0.15,4,4);
    const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.copy(pos).add(new THREE.Vector3(0,1,0));
    scene.add(mesh);
    particles.push({mesh,vel:new THREE.Vector3((Math.random()-0.5)*0.3,Math.random()*0.15,(Math.random()-0.5)*0.3),life:1.5});
  }
}

// ── Animation ──
let time=0;
const cameraTarget=new THREE.Vector3(20,0,0);
const cameraAngle={x:30,y:45};
let cameraDistance=30;
let isDragging=false,lastMouse={x:0,y:0};

window.addEventListener('mousedown',e=>{if(e.button===2||e.ctrlKey){isDragging=true;lastMouse.x=e.clientX;lastMouse.y=e.clientY;e.preventDefault();}});
window.addEventListener('mousemove',e=>{if(!isDragging)return;cameraAngle.x-=(e.clientX-lastMouse.x)*0.3;cameraAngle.y+=(e.clientY-lastMouse.y)*0.3;cameraAngle.y=Math.max(-60,Math.min(80,cameraAngle.y));lastMouse.x=e.clientX;lastMouse.y=e.clientY;});
window.addEventListener('mouseup',()=>{isDragging=false;});
window.addEventListener('wheel',e=>{cameraDistance+=e.deltaY*0.1;e.preventDefault();},{passive:false});
window.addEventListener('contextmenu',e=>e.preventDefault());

function animate(){
  requestAnimationFrame(animate);
  time+=0.01;
  const pm=meshes.get('player');
  const tx=pm?pm.position.x:cameraTarget.x;
  const tz=pm?pm.position.z:cameraTarget.z;
  cameraTarget.x+=(tx-cameraTarget.x)*0.05;
  cameraTarget.z+=(tz-cameraTarget.z)*0.05;
  const radX=cameraAngle.x*(Math.PI/180);
  const radY=cameraAngle.y*(Math.PI/180);
  const dist=Math.max(5,Math.min(80,cameraDistance));
  camera.position.x=cameraTarget.x+Math.sin(radX)*Math.cos(radY)*dist;
  camera.position.y=Math.max(3,cameraTarget.y+Math.sin(radY)*dist);
  camera.position.z=cameraTarget.z+Math.cos(radX)*Math.cos(radY)*dist;
  camera.lookAt(cameraTarget.x,cameraTarget.y,cameraTarget.z);

  if(pm)pm.position.y=1+Math.abs(Math.sin(time*2))*0.5;
  // Animate trees
  envMeshes.forEach(m=>{if(m.userData?.tree)m.rotation.y+=0.002;});
  // Expire damage numbers
  damageNumbers.forEach((d,i)=>{
    d.time-=0.016;
    if(d.time<=0){scene.remove(d.sprite);damageNumbers.splice(i,1);return}
    d.sprite.position.y+=0.05;
    d.sprite.material.opacity=d.time/2;
  });
  // Expire particles
  particles.forEach(p=>{p.life-=0.016;if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();}else{p.mesh.position.add(p.vel);p.mesh.material.opacity=p.life/1.5;}});
  particles=particles.filter(p=>p.life>0);
  renderer.render(scene,camera);
}

// Interaction menu
let interactionMenu=null;
function showInteractionMenu(event,entityData){
  if(interactionMenu){document.body.removeChild(interactionMenu);interactionMenu=null;}
  const menu=document.createElement('div');
  menu.style.cssText='position:absolute;background:rgba(0,0,0,0.9);border:2px solid #f90;border-radius:8px;padding:10px;z-index:100;color:#fff;font-size:12px;min-width:140px';
  menu.style.left=event.clientX+'px';menu.style.top=event.clientY+'px';
  menu.innerHTML=`<div style="color:#f90;margin-bottom:6px;font-weight:bold">${entityData.label||entityData.name}</div>`;
  // Action buttons
  const btns=[];
  if(entityData.interaction==='npc')btns.push({t:'💬 对话',a:()=>doDialogue(entityData)});
  if(entityData.interaction==='treasure')btns.push({t:'📦 打开宝箱',a:()=>doOpenChest(entityData)});
  if(entityData.interaction==='furnace')btns.push({t:'🔥 炼丹',a:()=>window.open('/alchemy.html','_blank')});
  if(entityData.interaction==='platform')btns.push({t:'🧘 修炼',a:()=>doCultivate()});
  if(entityData.interaction==='blacksmith')btns.push({t:'⚒ 炼器',a:()=>doCraft(entityData)});
  if(entityData.interaction==='chest')btns.push({t:'📦 存储',a:()=>doStorage(entityData)});
  if(entityData.interaction==='portal')btns.push({t:'🌀 '+entityData.label,a:()=>doTravel(entityData)});
  for(const b of btns) menu.innerHTML+=`<button onclick="this.closest('div').remove();(${b.a.toString()})()" style="display:block;width:100%;margin:2px 0;background:#333;color:#fff;border:1px solid #555;padding:6px;border-radius:3px;cursor:pointer;font-size:11px">${b.t}</button>`;
  document.body.appendChild(menu);
  interactionMenu=menu;
  setTimeout(()=>{if(interactionMenu===menu){document.body.removeChild(menu);interactionMenu=null;}},8000);
}

// Click to interact
window.addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON')return;
  if(interactionMenu){document.body.removeChild(interactionMenu);interactionMenu=null;}
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(scene.children,true);
  for(const hit of hits){
    let obj=hit.object;
    while(obj){
      if(obj.userData.interaction||obj.userData.type==='npc'){
        const data={interaction:obj.userData.interaction||'npc',name:obj.userData.name||obj.userData.label||(obj.userData.visual||{}).name,area:obj.userData.area,label:obj.userData.label};
        showInteractionMenu(e,data);
        return;
      }
      obj=obj.parent;
    }
  }
});

// Loot spawning
function spawnLootObject(pos,lootList){
  for(const l of lootList){
    const g=new THREE.Mesh(new THREE.OctahedronGeometry(0.4),new THREE.MeshStandardMaterial({color:0xffaa00,emissive:0xff6600,emissiveIntensity:0.5}));
    g.position.copy(pos).add(new THREE.Vector3((Math.random()-0.5)*2,0.5,(Math.random()-0.5)*2));
    g.userData={interaction:'treasure',label:l};
    g.castShadow=true;
    scene.add(g);
    setTimeout(()=>{scene.remove(g);g.geometry.dispose();g.material.dispose();},15000);
  }
}

// ── Interaction Points (placed in world) ──
function addInteractionPoint(x,z,type,label,color,extraY=0.8){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.6,0.3,8),new THREE.MeshStandardMaterial({color:0x444444}));
  base.position.y=0.15;
  const icon=new THREE.Mesh(new THREE.SphereGeometry(0.35,8,8),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.6}));
  icon.position.y=extraY;
  g.add(base);g.add(icon);
  g.position.set(x,0,z);
  g.userData={interaction:type,label};
  g.castShadow=true;
  scene.add(g);
  envMeshes.push(g);
  return g;
}
