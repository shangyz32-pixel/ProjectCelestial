<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Celestial 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
canvas{display:block}
#ui{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
#top{position:absolute;top:10px;left:10px;color:#fff;font-size:11px;display:flex;gap:12px}
#top span{background:rgba(0,0,0,0.6);padding:3px 8px;border-radius:3px}
#log{position:absolute;bottom:80px;left:10px;color:#ff0;font-size:11px;max-width:400px}
#hp{position:absolute;bottom:50px;left:10px;color:#f44;font-size:13px;font-weight:bold}
#bar{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.btn{pointer-events:all;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:8px 14px;border-radius:5px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,0.15)}
.btn-gold{border-color:#f90;color:#f90}
.btn-danger{border-color:#f44;color:#f88}
.btn-info{border-color:#48f;color:#8cf}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top"><span id="tick">T0</span><span id="zone">翠竹林</span><span id="lv">Lv1</span></div>
  <div id="hp">❤ 100/100</div>
  <div id="log">🌲 进入翠竹林...</div>
  <div id="bar">
    <button class="btn btn-info" onclick="api('cultivate',{mode:'risky'})">⚡修炼</button>
    <button class="btn" onclick="api('rest')">🛌休息</button>
    <button class="btn btn-gold" onclick="doExplore()">🔍探索</button>
    <button class="btn" onclick="api('alchemy/gather',{herb:'spirit_grass'})">🌿采集</button>
    <button class="btn btn-danger" onclick="api('breakthrough')">💫突破</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const B='http://localhost:3000';
const G=p=>fetch(B+p).then(r=>r.json());
const P=(p,d)=>fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})}).then(r=>r.json());

// Scene
const sc=new THREE.Scene();
sc.background=new THREE.Color(0x112233);
sc.fog=new THREE.Fog(0x112233,30,120);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,200);
cam.position.set(15,20,25);cam.lookAt(0,0,0);
const ren=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

// Lighting
sc.add(new THREE.AmbientLight(0x334455,1.5));
const sun=new THREE.DirectionalLight(0xffeedd,2);sun.position.set(20,30,10);sun.castShadow=true;sc.add(sun);

// Ground
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x224422,roughness:0.9}));
gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;sc.add(gnd);

// Trees
for(let i=0;i<30;i++){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,2.5),new THREE.MeshStandardMaterial({color:0x553311})));
  g.add(new THREE.Mesh(new THREE.ConeGeometry(1,3,6),new THREE.MeshStandardMaterial({color:0x229933})));
  g.children[0].position.y=1.2;g.children[1].position.y=3;
  g.position.set((Math.random()-0.5)*80,0,(Math.random()-0.5)*80);g.castShadow=true;sc.add(g);
}

// Player
const playerMesh=new THREE.Group();
playerMesh.add(new THREE.Mesh(new THREE.BoxGeometry(0.8,1.5,0.6),new THREE.MeshStandardMaterial({color:0x4488ff})));
const head=new THREE.Mesh(new THREE.SphereGeometry(0.3,6,4),new THREE.MeshStandardMaterial({color:0x4488ff}));
head.position.y=1.1;playerMesh.add(head);
playerMesh.position.set(0,1,0);playerMesh.castShadow=true;sc.add(playerMesh);

// Camera follow vars
let px=0,pz=0;

// WASD
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true});
window.addEventListener('keyup',e=>{keys[e.key]=false});

// Sync world
async function sync(){
  const w=await G('/api/world');if(!w)return;
  document.getElementById('tick').textContent='T'+w.tick;
  const p=await G('/api/game/player');
  const d=p.player||p;
  if(d&&d.name){
    document.getElementById('hp').textContent='❤ '+(d.hp_current||100)+'/'+(d.hp_max||100);
    document.getElementById('lv').textContent='Lv'+(d.realm_id||1)+' '+(Math.round((d.progress||d.cultivation||0)*100))+'%';
    const area=d.current_area||d.area;
    const names={area_bamboo_grove:'翠竹林',area_misty_peak:'云雾峰',area_thunder_valley:'雷音谷',area_dragon_vein:'龙脉秘境'};
    document.getElementById('zone').textContent=names[area]||area||'翠竹林';
  }
}

// API action
window.api=async function(path,data){
  const r=await P('/api/game/'+path,data);
  document.getElementById('log').textContent=r.msg||(r.ok?'✅ 完成':'❌ 失败');
  await sync();
};

// Explore
window.doExplore=async function(){
  const r=await P('/api/game/explore',{area:'area_bamboo_grove'});
  let msg=r.msg||'';
  if(r.type==='fight')msg='⚔ '+r.monster?.name+'! 伤害'+r.playerDmg+'/受'+r.monsterDmg;
  if(r.type==='victory')msg='💀 击杀 '+r.monster?.name+'! 获得 '+(r.loot||[]).join(' ');
  document.getElementById('log').textContent=msg||'🌲 探索中...';
  if(r.milestone)document.getElementById('log').textContent+=' 🏆'+r.milestone;
  await sync();
};

// Game loop
function loop(){
  requestAnimationFrame(loop);
  // Movement
  if(keys['w']||keys['ArrowUp'])pz-=0.2;
  if(keys['s']||keys['ArrowDown'])pz+=0.2;
  if(keys['a']||keys['ArrowLeft'])px-=0.2;
  if(keys['d']||keys['ArrowRight'])px+=0.2;
  px=Math.max(-40,Math.min(40,px));pz=Math.max(-40,Math.min(40,pz));
  playerMesh.position.x=px;playerMesh.position.z=pz;
  // Camera smooth follow
  cam.position.x+=(px-cam.position.x)*0.05;
  cam.position.z+=(pz+20-cam.position.z)*0.05;
  cam.lookAt(px,0,pz);
  ren.render(sc,cam);
}

(async()=>{
  const p=await G('/api/game/player');
  if(!p.player||!p.player.name)await P('/api/game/player/create',{name:'云游道人'});
  await sync();
})();
setInterval(sync,3000);
loop();
</script></body></html>
