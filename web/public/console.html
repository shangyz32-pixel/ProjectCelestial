<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Celestial — Developer Console</title>
<style>
:root{--bg:#080c14;--panel:#0f1623;--border:#1a2740;--text:#9ca3af;--dim:#4b5563;--accent:#38bdf8;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--hp:#f87171;--stamina:#a78bfa;--realm:#38bdf8;--hl:#1a2740}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:monospace;font-size:12px;display:flex;height:100vh}
aside{width:200px;background:var(--panel);border-right:1px solid var(--border);padding:12px 0;overflow-y:auto;flex-shrink:0}
aside h2{font-size:13px;color:var(--accent);padding:0 12px 8px;border-bottom:1px solid var(--border);margin-bottom:4px}
aside .nav-item{display:block;padding:6px 12px;color:var(--text);text-decoration:none;cursor:pointer;font-size:11px;border-left:2px solid transparent}
aside .nav-item:hover,.nav-item.active{color:var(--accent);background:rgba(56,189,248,0.05);border-left-color:var(--accent)}
main{flex:1;overflow-y:auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:14px;margin-bottom:12px}
.panel h2{font-size:13px;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.stat{background:rgba(56,189,248,0.03);border:1px solid var(--border);border-radius:4px;padding:10px}
.stat .l{font-size:10px;color:var(--dim)}.stat .v{font-size:16px;color:var(--accent);font-weight:bold;margin-top:2px}
.controls{display:flex;gap:6px;flex-wrap:wrap}
.controls button{background:var(--panel);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:3px;cursor:pointer;font-family:monospace;font-size:11px}
.controls button:hover{border-color:var(--accent);color:var(--accent)}
.controls button.danger:hover{border-color:var(--red);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:4px 8px;color:var(--dim);border-bottom:1px solid var(--border)}
td{padding:4px 8px;border-bottom:1px solid rgba(26,39,64,0.4)}tr:hover td{background:rgba(56,189,248,0.02)}
.bar{height:5px;border-radius:2px;background:var(--border);overflow:hidden}.bar-fill{height:100%;border-radius:2px}
.bar-hp{background:var(--hp)}.bar-cv{background:var(--realm)}.bar-stamina{background:var(--stamina)}
.badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px}
.badge-success{background:rgba(34,197,94,.15);color:var(--green)}
.badge-info{background:rgba(56,189,248,.15);color:var(--accent)}
.badge-warn{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge-danger{background:rgba(239,68,68,.15);color:var(--red)}
.view{display:none}.view.active{display:block}
input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:3px;font-family:monospace;font-size:11px}
.status-bar{background:var(--panel);border-top:1px solid var(--border);padding:4px 12px;font-size:10px;color:var(--dim);display:flex;gap:16px}
#log-panel{max-height:300px;overflow-y:auto;font-size:10px;background:var(--bg);padding:8px;border-radius:4px}
.log-line{padding:1px 4px;color:var(--dim)}.log-line.error{color:var(--red)}.log-line.warn{color:var(--yellow)}
</style>
</head>
<body>

<aside>
  <h2>◈ Dev Console</h2>
  <div class="nav-item active" data-view="dashboard">Dashboard</div>
  <div class="nav-item" data-view="world">World Inspector</div>
  <div class="nav-item" data-view="entities">Entity Explorer</div>
  <div class="nav-item" data-view="npcs">NPCs</div>
  <div class="nav-item" data-view="systems">System Monitor</div>
  <div class="nav-item" data-view="events">Event Viewer</div>
  <div class="nav-item" data-view="history">History</div>
  <div class="nav-item" data-view="snapshots">Snapshot Manager</div>
  <div class="nav-item" data-view="transactions">Transactions</div>
  <div class="nav-item" data-view="api">API Explorer</div>
  <div class="nav-item" data-view="perf">Performance</div>
  <div class="nav-item" data-view="logs">Logs & Debug</div>
</aside>

<div style="display:flex;flex-direction:column;flex:1">
<main id="main-content"></main>
<div class="status-bar">
  <span id="bar-state">⚫ Connecting...</span>
  <span id="bar-tick">Tick: 0</span>
  <span id="bar-npcs">NPCs: 0</span>
  <span id="bar-events">Events: 0</span>
  <span id="bar-memory">Mem: 0MB</span>
</div>
</div>

<script>
// ═════════ API helpers ═════════
const $=s=>document.getElementById(s);
async function G(p){return (await fetch(p)).json()}
async function P(p,b){return (await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json()}

function navTo(view) {
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  document.querySelector(`[data-view="${view}"]`).classList.add("active");
  routes[view]();
}

// ═════ Routes ═════
const routes = {
  dashboard: async () => {
    const w=await G("/api/world"), p=await G("/api/perf");
    $("main-content").innerHTML=`
      <div class="panel"><h2>Runtime Status</h2>
        <div class="grid">${mk("State",w.sim_state,"Time",w.time,"Tick",w.tick,"Season",w.season,"Weather",w.weather,"Qi",(w.qi||0).toFixed(3),"Entities",w.entities,"NPCs",w.npcs,"Snapshots",w.snapshots,"Events",p.events,"Memory",p.memory_mb+"MB","Uptime",p.uptime+"s")}</div>
      </div>
      <div class="panel"><h2>Controls</h2><div class="controls">
        <button onclick="cmd('tick',1)">+1 Tick</button>
        <button onclick="cmd('tick',10)">+10</button>
        <button onclick="cmd('tick',100)">+100</button>
        <button onclick="cmd('tick',1000)">+1000</button>
        <button onclick="cmd('pause')">Pause</button>
        <button onclick="cmd('resume')">Resume</button>
        <button onclick="cmd('snapshot')">Snapshot</button>
        <button onclick="cmd('npc')">+NPC</button>
      </div></div>`;
  },

  world: async () => {
    const w=await G("/api/world");
    $("main-content").innerHTML=`<div class="panel"><h2>World Inspector</h2>
      ${tbl(["World ID",w.world_id],["Seed",w.seed],["Tick",w.tick],["Time",w.time],["Season",w.season],["Weather",w.weather],["Qi",(w.qi||0).toFixed(4)],["Era",w.era],["Entities",w.entities],["NPCs",w.npcs],["Snapshots",w.snapshots],["Sim State",w.sim_state])}</div>`;
  },

  entities: async () => {
    const ents=await G("/api/entities");
    $("main-content").innerHTML=`<div class="panel"><h2>Entity Explorer (${ents.length})</h2>
      <input id="entFilter" placeholder="Filter by type or ID..." oninput="filterEntities()" style="margin-bottom:8px;width:300px">
      <table><thead><tr><th>ID</th><th>Type</th><th>Ver</th><th>State</th><th>Components</th><th>Created</th></tr></thead>
      <tbody id="ent-table">${ents.map(e=>`<tr data-type="${e.type}" data-id="${e.id}"><td><a href="#" onclick="viewEntity('${e.id}')">${e.id}</a></td><td>${e.type}</td><td>v${e.version}</td><td><span class="badge ${e.state==='active'?'badge-success':'badge-warn'}">${e.state}</span></td><td>${e.components.join(", ")}</td><td>${e.createdAt?.slice(0,10)}</td></tr>`).join("")}</tbody></table></div>`;
  },

  npcs: async () => {
    const npcs=await G("/api/npcs");
    $("main-content").innerHTML=`<div class="panel"><h2>NPCs (${npcs.length})</h2>
      <table><thead><tr><th>Name</th><th>Age</th><th>Realm</th><th>Cultivation</th><th>HP</th><th>Stamina</th><th>Breakthroughs</th><th>State</th></tr></thead>
      <tbody>${npcs.map(n=>`<tr><td>${n.name}</td><td>${n.age}</td><td><span class="badge badge-info">Lv${n.realm_id}</span></td><td><div class="bar"><div class="bar-fill bar-cv" style="width:${(n.cultivation*100).toFixed(0)}%"></div></div>${(n.cultivation*100).toFixed(1)}%</td><td><div class="bar"><div class="bar-fill bar-hp" style="width:${hpp(n.hp)}%"></div></div>${n.hp}</td><td><div class="bar"><div class="bar-fill bar-stamina" style="width:${hpp(n.stamina)}%"></div></div>${n.stamina}</td><td><span class="badge badge-success">${n.breakthroughs}</span></td><td>${n.state}</td></tr>`).join("")}</tbody></table></div>`;
  },

  systems: async () => {
    const s=await G("/api/systems");
    $("main-content").innerHTML=`<div class="panel"><h2>System Monitor</h2>
      <div class="grid">${s.systems.map(sys=>`<div class="stat"><div class="l">${sys.name}</div><div class="v" style="font-size:13px;color:var(--green)">${sys.status}</div></div>`).join("")}</div>
      <div style="margin-top:8px;font-size:10px;color:var(--dim)">Tick order: ${s.systems.map(x=>x.name).join(" → ")}</div></div>`;
  },

  events: async () => {
    const evts=await G("/api/events?limit=100");
    $("main-content").innerHTML=`<div class="panel"><h2>Event Viewer (last ${evts.length})</h2>
      <div id="log-panel">${evts.map(e=>`<div class="log-line">T${e.tick} <b>${e.type}</b> → ${e.target} ${e.payload?JSON.stringify(e.payload).slice(0,60):""}</div>`).join("")}</div></div>`;
  },

  history: async () => {
    const h=await G("/api/history");
    $("main-content").innerHTML=`<div class="panel"><h2>History (${h.length} entries)</h2>
      ${h.slice().reverse().map(e=>`<div style="padding:3px 0;border-bottom:1px solid var(--border);font-size:11px"><span style="color:var(--accent)">Tick ${e.tick}</span> ${e.time} | ${e.weather} | Qi:${e.qi}</div>`).join("")||"<span style='color:var(--dim)'>No history yet</span>"}</div>`;
  },

  snapshots: async () => {
    const s=await G("/api/snapshots");
    $("main-content").innerHTML=`<div class="panel"><h2>Snapshot Manager (${s.list.length})</h2>
      ${s.list.map((id,i)=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><span>${id}</span><span><button onclick="P('/api/snapshot/load',{snapshot_id:'${id}'})">Load</button></span></div>`).join("")||"<span style='color:var(--dim)'>No snapshots</span>"}
      <div style="margin-top:8px"><button onclick="P('/api/snapshot/take')">Take New Snapshot</button></div></div>`;
  },

  transactions: async () => {
    const t=await G("/api/transactions");
    $("main-content").innerHTML=`<div class="panel"><h2>Transaction Explorer</h2>
      ${tbl(["Active Tx",t.active],["Event Log Size",t.event_log_size])}</div>`;
  },

  api: async () => {
    $("main-content").innerHTML=`<div class="panel"><h2>API Explorer</h2>
      <div class="grid">
        ${["/api/world","/api/npcs","/api/entities","/api/systems","/api/events","/api/history","/api/snapshots","/api/transactions","/api/perf"].map(p=>`<div class="stat" style="cursor:pointer" onclick="testApi('${p}')"><div class="l">GET</div><div class="v" style="font-size:11px">${p}</div></div>`).join("")}
      </div>
      <div id="api-result" style="margin-top:8px;background:var(--bg);padding:8px;border-radius:4px;max-height:300px;overflow:auto;font-size:10px;white-space:pre-wrap"></div></div>`;
  },

  perf: async () => {
    const p=await G("/api/perf");
    $("main-content").innerHTML=`<div class="panel"><h2>Performance Monitor</h2>
      <div class="grid">${mk("Tick",p.tick,"Entities",p.entities,"NPCs",p.npcs,"Events",p.events,"Snapshots",p.snapshots,"Memory",p.memory_mb+"MB","Total",p.memory_total_mb+"MB","Uptime",p.uptime+"s")}</div></div>`;
  },

  logs: async () => {
    const p=await G("/api/perf"), t=await G("/api/transactions");
    $("main-content").innerHTML=`<div class="panel"><h2>Debug & Verification</h2>
      <div class="controls">
        <button onclick="verifyHash()">Check Hashes</button>
        <button onclick="P('/api/tick/advance',{count:10})">Run 10 Ticks</button>
        <button onclick="P('/api/tick/advance',{count:100})">Run 100 Ticks</button>
      </div>
      <div id="debug-result" style="margin-top:8px;font-size:11px"></div>
      <div style="margin-top:12px">${tbl(["Active Tx",t.active],["Event Log",t.event_log_size],["Memory",p.memory_mb+"MB"],["Entities",p.entities],["Snapshots",p.snapshots])}</div></div>`;
  }
};

// ═════ Helpers ═════
function mk(...pairs){let h="";for(let i=0;i<pairs.length;i+=2)h+=`<div class="stat"><div class="l">${pairs[i]}</div><div class="v">${pairs[i+1]}</div></div>`;return h}
function tbl(...rows){return`<table>${rows.map(([k,v])=>`<tr><td style="color:var(--dim)">${k}</td><td>${v}</td></tr>`).join("")}</table>`}
function hpp(s){if(!s)return 0;const[a,b]=s.split("/").map(Number);return b?Math.round(a/b*100):0}

async function cmd(action,val){
  const m={tick:["/api/tick/advance",{count:val}],pause:["/api/sim/pause"],resume:["/api/sim/resume"],snapshot:["/api/snapshot/take"],npc:["/api/npc/create",{name:"NPC_"+Date.now().toString(36),age:20,realm:1}]};
  await P(...m[action]||["/api/tick/advance",{count:1}]);
  routes[document.querySelector(".nav-item.active").dataset.view]();
}

async function viewEntity(id){const e=await G("/api/entity?id="+id);alert(JSON.stringify(e,null,2))}
function filterEntities(){const f=$("entFilter")?.value?.toLowerCase()||"";document.querySelectorAll("#ent-table tr").forEach(r=>{r.style.display=(!f||r.dataset.type.includes(f)||r.dataset.id.includes(f))?"":"none"})}

async function testApi(path){const r=await G(path);$("api-result").textContent=JSON.stringify(r,null,2)}
async function verifyHash(){$("debug-result").innerHTML="Hash verification requires replay engine — run verify_sprint1_alpha.js";}

// ═════ Status bar ═════
async function updateBar(){try{const w=await G("/api/world"),p=await G("/api/perf");$("bar-state").innerHTML=`<span style="color:${w.sim_state==='running'?'var(--green)':'var(--yellow)'}">⬤</span> ${w.sim_state}`;$("bar-tick").textContent=`Tick: ${w.tick}`;$("bar-npcs").textContent=`NPCs: ${w.npcs}`;$("bar-events").textContent=`Events: ${p.events}`;$("bar-memory").textContent=`Mem: ${p.memory_mb}MB`}catch(e){$("bar-state").innerHTML='<span style="color:var(--red)">⬤</span> Offline'}}

// ═════ Init ═════
document.querySelectorAll(".nav-item").forEach(n=>n.addEventListener("click",()=>navTo(n.dataset.view)));
setInterval(updateBar,2000);
navTo("dashboard");
</script>
</body>
</html>
