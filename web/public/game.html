<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Celestial — 修仙世界</title>
<style>
:root{--bg:#0a0c10;--panel:#11151d;--border:#1a2030;--text:#bcc8d6;--dim:#5a6880;--gold:#d4a843;--jade:#3dbf8f;--hp:#d94a4a;--stam:#7b6fde;--realm:#4da6e8;--warn:#e0903d;--rare:#b85cd4;--dark:#06080c;--accent:#2a6fd4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","SimHei","PingFang SC",sans-serif;font-size:13px;line-height:1.5;overflow-x:hidden}
#app{display:flex;flex-direction:column;min-height:100vh}
/* Top Bar */
#topbar{background:var(--dark);border-bottom:1px solid var(--border);padding:6px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#topbar .title{font-size:15px;color:var(--gold);font-weight:bold;letter-spacing:2px}
#topbar .info{color:var(--dim);font-size:11px}
/* Main Layout */
#main{display:flex;flex:1;gap:1px;background:var(--border)}
#left-panel{width:220px;background:var(--panel);padding:10px;flex-shrink:0;overflow-y:auto}
#center-panel{flex:1;background:var(--panel);padding:12px;overflow-y:auto}
#right-panel{width:250px;background:var(--panel);padding:10px;flex-shrink:0;overflow-y:auto}
/* Sections */
.section{margin-bottom:12px}
.section-title{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:3px}
/* Character */
.char-portrait{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--realm),var(--jade));margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;text-shadow:0 0 10px rgba(255,255,255,0.5)}
.char-name{font-size:15px;text-align:center;color:var(--gold);font-weight:bold}
.char-realm{text-align:center;font-size:12px;color:var(--realm)}
.progress-bar{height:6px;background:var(--dark);border-radius:3px;margin:3px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 0.3s}
.cultivation-fill{background:linear-gradient(90deg,var(--realm),var(--jade))}
.hp-fill{background:linear-gradient(90deg,var(--hp),#e07070)}
.stamina-fill{background:linear-gradient(90deg,var(--stam),#9888f0)}
.stat-row{display:flex;justify-content:space-between;font-size:11px;margin:2px 0}
.stat-label{color:var(--dim)}.stat-val{color:var(--text)}
/* Buttons */
.btn{display:block;width:100%;padding:8px;margin:3px 0;border:1px solid var(--border);border-radius:4px;background:var(--dark);color:var(--text);cursor:pointer;font-size:12px;text-align:center;transition:all 0.2s}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;font-weight:bold}
.btn-danger{color:var(--hp)}.btn-danger:hover{background:var(--hp);color:#fff}
.btn-gold{color:var(--gold)}.btn-gold:hover{background:var(--gold);color:var(--dark)}
.btn-jade{color:var(--jade)}.btn-jade:hover{background:var(--jade);color:var(--dark)}
.btn-rare{color:var(--rare)}.btn-rare:hover{background:var(--rare);color:#fff}
.btn-group{display:flex;gap:4px}.btn-group .btn{flex:1}
/* Breakthrough */
#bt-panel{background:rgba(212,168,67,0.05);border:1px solid rgba(212,168,67,0.2);border-radius:6px;padding:10px;margin:8px 0;text-align:center;display:none}
#bt-panel .bt-title{color:var(--gold);font-size:14px;font-weight:bold;margin-bottom:4px}
#bt-panel .bt-info{font-size:11px;color:var(--dim);margin-bottom:6px}
/* Areas */
.area-card{background:var(--dark);border:1px solid var(--border);border-radius:6px;padding:10px;margin:6px 0;cursor:pointer;transition:all 0.2s;display:flex;justify-content:space-between;align-items:center}
.area-card:hover{border-color:var(--accent)}
.area-card.locked{opacity:0.5;cursor:not-allowed}
.area-name{font-weight:bold;font-size:13px}
.area-desc{font-size:11px;color:var(--dim)}
.area-qi{font-size:11px;color:var(--realm)}
/* NPC List */
.npc-row{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid var(--border)}
.npc-name{color:var(--gold)}.npc-info{color:var(--dim)}
/* Feed */
.feed-item{font-size:10px;padding:3px 0;border-bottom:1px solid var(--border);color:var(--dim)}
.feed-item .time{color:var(--realm);margin-right:4px}
.feed-item .event{color:var(--text)}
/* Message */
#msg{text-align:center;padding:6px;margin-bottom:6px;border-radius:4px;font-size:13px;font-weight:bold;min-height:20px;transition:all 0.3s}
#msg.success{background:rgba(61,191,143,0.1);color:var(--jade)}
#msg.fail{background:rgba(217,74,74,0.1);color:var(--hp)}
#msg.info{background:rgba(77,166,232,0.1);color:var(--realm)}
#msg.warn{background:rgba(224,144,61,0.1);color:var(--warn)}
/* Quest */
.quest-row{font-size:11px;padding:3px 0;border-bottom:1px solid var(--border)}
.quest-done{color:var(--jade)}.quest-pending{color:var(--dim)}
/* Save */
#save-indicator{font-size:10px;color:var(--dim);text-align:center;margin-top:4px}
/* Create Screen */
#create-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
#create-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:40px;text-align:center;min-width:300px}
#create-box h2{color:var(--gold);margin-bottom:16px;font-size:20px}
#create-box input{width:100%;padding:10px;background:var(--dark);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:16px;text-align:center;margin-bottom:10px}
#create-box button{width:100%}
/* Scroll */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--dark)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* Mobile responsive */
@media(max-width:768px){#main{flex-direction:column}#left-panel,#right-panel{width:100%}}
</style></head><body>
<div id="create-screen"><div id="create-box"><h2>◈ 踏入仙途 ◈</h2><input id="char-name" placeholder="道号..." value="凌云子"><button class="btn btn-primary" onclick="createChar()">踏入修仙之路</button></div></div>

<div id="app" style="display:none">
  <div id="topbar"><div class="title">◈ 仙途 ◈</div><div class="info"><span id="top-time">天历元年</span> · <span id="top-weather">晴</span> · 第<span id="top-tick">0</span>天</div></div>
  <div id="main">
    <!-- LEFT: Character -->
    <div id="left-panel">
      <div class="section"><div class="char-portrait">修</div><div class="char-name" id="pn">—</div><div class="char-realm" id="pr">—</div></div>
      <div class="section"><div class="section-title">修为</div><div class="progress-bar"><div class="progress-fill cultivation-fill" id="pb" style="width:0%"></div></div><div class="stat-row"><span class="stat-label">进度</span><span class="stat-val" id="pv">0%</span></div><div class="stat-row"><span class="stat-label">突破</span><span class="stat-val" id="pbr">0次</span></div></div>
      <div class="section"><div class="section-title">状态</div><div class="stat-row"><span class="stat-label">生命</span><span class="stat-val" id="hv">—</span></div><div class="progress-bar"><div class="progress-fill hp-fill" id="hb" style="width:100%"></div></div><div class="stat-row"><span class="stat-label">体力</span><span class="stat-val" id="sv">—</span></div><div class="progress-bar"><div class="progress-fill stamina-fill" id="sb" style="width:100%"></div></div></div>
      <div class="section"><div class="section-title">所在</div><div class="stat-row"><span class="stat-label">区域</span><span class="stat-val" id="pa">—</span></div></div>
      <div class="section"><div class="section-title">声望</div><div class="stat-row"><span class="stat-label">称号</span><span class="stat-val" id="p-rep-title">—</span></div><div class="stat-row"><span class="stat-label">分数</span><span class="stat-val" id="p-rep-score">0</span></div></div>
      <div class="section"><div class="section-title">成就</div><div id="achievements" style="font-size:14px">—</div></div>
      <div class="section" id="cult-section"><div class="section-title">修仙根基</div><div id="cult-info" style="font-size:11px;color:var(--dim)">—</div></div>
      <div class="section"><div class="section-title">背包</div><div id="pinv" style="font-size:11px;color:var(--dim)">空</div></div>
      <div class="section"><button class="btn btn-gold" onclick="foundSect()" id="bt-sect">🏛 创立宗门</button></div>
      <div id="save-indicator">💾 已自动保存</div>
    </div>

    <!-- CENTER: Actions -->
    <div id="center-panel">
      <div id="msg"></div>
      <div id="bt-panel"><div class="bt-title">⚡ 修为圆满 — 准备突破</div><div class="bt-info" id="bt-info"></div><button class="btn btn-gold" onclick="attemptBreakthrough(false)">立即突破 (成功率 <span id="bt-chance">30</span>%)</button><button class="btn btn-jade" onclick="attemptBreakthrough(true)" id="bt-jade-btn" style="display:none">灵石护法 (成功率 <span id="bt-jade-chance">50</span>%)</button><button class="btn" onclick="cultivate('normal')">压制修为 (+2%成功率)</button></div>

      <div class="section"><div class="section-title">修炼</div>
        <div class="btn-group"><button class="btn" onclick="cultivate('safe')">稳妥 +0.5%</button><button class="btn btn-primary" onclick="cultivate('normal')">普通 +2%</button><button class="btn btn-danger" onclick="cultivate('risky')">冒险 +5%</button></div>
        <button class="btn btn-jade" onclick="cultivate('normal',true)" id="bt-herb" style="display:none;margin-top:4px">服用灵草 +10%</button>
        <button class="btn" onclick="rest()" style="margin-top:4px;color:var(--stam)">🛌 休息 +30体力</button>
      </div>

      <div class="section"><div class="section-title">交互</div>
        <button class="btn" onclick="openShop()" style="margin:2px">🛒 商店</button>
        <button class="btn" onclick="talkNPC()" style="margin:2px">💬 对话</button>
        <button class="btn" onclick="openSect()" style="margin:2px">🏛 宗门</button>
        <div id="shop-panel" style="display:none;margin-top:8px"></div>
        <div id="dialogue-panel" style="display:none;margin-top:8px"></div>
        <div id="sect-panel" style="display:none;margin-top:8px"></div>
      </div>

      <div class="section"><div class="section-title">探索区域</div><div id="areas"></div></div>
      <div class="section"><div class="section-title">指引</div><div id="quests"></div></div>
      <div class="section" style="text-align:center"><a href="/living-world.html" style="color:var(--dim);font-size:11px;text-decoration:none">🌌 天道观察</a></div>
    </div>

    <!-- RIGHT: World -->
    <div id="right-panel">
      <div class="section"><div class="section-title">天道修士</div><div id="npc-list"></div></div>
      <div class="section"><div class="section-title">世界动态</div><div id="world-feed" style="max-height:180px;overflow-y:auto"></div></div>
      <div class="section"><div class="section-title">通知</div><div id="notifications"></div></div>
    </div>
  </div>
</div>

<script>
const AREA_NAMES={area_bamboo_grove:"翠竹林",area_misty_peak:"云雾峰",area_thunder_valley:"雷音谷",area_dragon_vein:"龙脉秘境"};
const RES_NAMES={spirit_herb:"灵草",jade_shard:"灵石碎片",thunder_ore:"雷晶石",dragon_scale:"龙鳞",ancient_jade:"古玉"};
let _tick=0,_saveTick=0,$=id=>document.getElementById(id);

async function G(p){return(await fetch(p)).json()}
async function P(p,b){return(await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json()}

async function createChar(){const n=$("char-name").value||"修士";await P("/api/game/player/create",{name:n});$("create-screen").style.display="none";$("app").style.display="flex";refresh();setInterval(refresh,3000)}
function showMsg(t,c){$("msg").textContent=t;$("msg").className=c||"info";setTimeout(()=>{$("msg").textContent="";$("msg").className=""},3000)}
function notify(t,lvl){
  const colors={info:"#4da6e8",success:"#3dbf8f",warn:"#e0903d",danger:"#d94a4a",rare:"#b85cd4"};
  const d=document.createElement("div");d.className="feed-item";
  d.innerHTML=`<span style="color:${colors[lvl]||colors.info}">✦</span> ${t}`;
  $("notifications").prepend(d);if($("notifications").children.length>8)$("notifications").lastChild.remove()
}

async function refresh(){
  const p=await G("/api/game/player");if(!p.player)return;const d=p.player;
  const newAch=p.newAchievements||[];
  // Notify new achievements
  for(const a of newAch){notify(`${a.icon} 成就解锁: ${a.name}`,"rare")}
  $("pn").textContent=d.name;$("pr").textContent="Lv"+d.realm_id;
  const cv=(d.cultivation*100).toFixed(1);$("pb").style.width=cv+"%";$("pv").textContent=cv+"%";
  $("pbr").textContent=d.breakthroughs;
  // HP/Stamina dual-format
  let hpC=100,hpM=100,stC=100,stM=100;
  if(d.hp_current!==undefined){hpC=d.hp_current;hpM=d.hp_max}else if(Array.isArray(d.hp)){[hpC,hpM]=d.hp}
  if(d.stamina_current!==undefined){stC=d.stamina_current;stM=d.stamina_max}else if(Array.isArray(d.stamina)){[stC,stM]=d.stamina}
  $("hb").style.width=Math.round(hpC/hpM*100)+"%";$("hv").textContent=hpC+"/"+hpM;
  $("sb").style.width=Math.round(stC/stM*100)+"%";$("sv").textContent=stC+"/"+stM;
  $("pa").textContent=AREA_NAMES[d.current_area]||d.current_area;
  // Reputation
  const rep=d.reputation||{};$("p-rep-title").textContent=rep.title||"无名修士";$("p-rep-score").textContent=rep.score||0;
  // Legacy — hide sect button if already founded
  if(d.legacy?.founded_sect){$("bt-sect").style.display="none"}
  // Achievements
  const achs=d.achievements||[];if(achs.length>0){$("achievements").textContent=achs.map(a=>a.icon).join(" ")}else{$("achievements").textContent="—"}
  // Cultivation framework
  const root=d.spiritual_root;const con=d.constitution;const method=d.cultivation_method;
  if(root||con||method){
    let cultTxt="";
    if(root)cultTxt+=`灵根: ${root.name||"?"} (${root.rarity||"common"}) `;
    if(con)cultTxt+=`体质: ${con.name||"?"} `;
    if(method)cultTxt+=`功法: ${method.name||"?"}`;
    $("cult-info").textContent=cultTxt||"—";
    $("cult-section").style.display="block";
  }else{$("cult-section").style.display="none"}
  // Inventory
  const res=await G("/api/game/player/resources");const rd=res.resources||{};
  $("pinv").innerHTML=Object.entries(rd).map(([k,v])=>`<div class="stat-row"><span class="stat-label">${RES_NAMES[k]||k}</span><span class="stat-val">${v}</span></div>`).join("")||"<span style='color:var(--dim);font-size:11px'>空空如也</span>";
  $("bt-herb").style.display=(rd.spirit_herb>0)?"block":"none";$("bt-jade-btn").style.display=(rd.jade_shard>0)?"block":"none";
  // Areas
  const areas=await G("/api/game/areas");
  $("areas").innerHTML=areas.areas.map(a=>{
    const unlocked=a.unlocked||a.req_realm<=d.realm_id;
    const resNames=(a.resources||[]).map(r=>a.resource_names?.[r]||r).join("、");
    const gatherBtns=(unlocked&&a.id===d.current_area)?(a.resources||[]).map(r=>`<button class="btn" style="padding:3px 8px;font-size:10px;margin:2px" onclick="event.stopPropagation();gather('${r}')">${a.resource_names?.[r]||r}</button>`).join(""):"";
    return`<div class="area-card${unlocked?'':' locked'}" onclick="${unlocked?`doMove('${a.id}')`:'void(0)'}"><div><div class="area-name">${a.name} ${unlocked?'':'🔒 Lv'+a.req_realm}</div><div class="area-desc">${a.desc}</div></div><div style="text-align:right"><div class="area-qi">Qi ${a.qi}</div><div style="font-size:10px;color:var(--dim)">${resNames}</div>${unlocked?`<button class="btn" style="margin-top:4px;font-size:10px" onclick="event.stopPropagation();doExplore('${a.id}')">🔍 探索</button>`:''}${gatherBtns}</div></div>`;
  }).join("");
  // Top bar
  const w=await G("/api/world");
  _tick=w.tick;$("top-tick").textContent=w.tick;$("top-time").textContent=w.time;$("top-weather").textContent=w.weather||"晴";
  // NPCs
  const npcs=await G("/api/npcs");
  $("npc-list").innerHTML=npcs.map(n=>`<div class="npc-row"><span class="npc-name">${n.name||"?"}</span><span class="npc-info">Lv${n.realm_id} · 破${n.breakthroughs||0}次</span></div>`).join("");
  // World feed
  const ev=await G("/api/events?limit=6");
  // Build NPC name map from npcs
  const nameMap={};for(const n of npcs)nameMap[n.id]=n.name;
  function rn(id){return nameMap[id]||id||"世界"}
  $("world-feed").innerHTML=ev.map(e=>{
    let desc=e.type;
    if(e.type==="EntityUpdated"&&e.target){
      const nm=rn(e.target);
      if(e.payload?.component==="Realm"&&e.payload?.newValue?.realm_id>(e.payload?.oldValue?.realm_id||0))
        desc=`${nm} 突破至 Lv${e.payload.newValue.realm_id}`;
      else if(e.payload?.component==="HP")desc=`${nm} 生命变化`;
      else if(e.payload?.component==="Identity")desc=`${nm} 寿元增长`;
      else if(e.payload?.component==="Inventory")desc=`${nm} 获得物品`;
      else if(e.payload?.component==="Location")desc=`${nm} 移动至新区域`;
      else desc=`${nm} 状态更新`;
    }
    return`<div class="feed-item"><span class="time">T${e.tick}</span><span class="event">${desc}</span></div>`;
  }).join("")||"<span style='color:var(--dim)'>世界安宁...</span>";
  // Quests
  let qs=[];
  if(d.realm_id<3)qs.push({txt:`达到 Lv3 解锁云雾峰`,done:d.realm_id>=3});
  if(d.realm_id<6)qs.push({txt:`达到 Lv6 解锁雷音谷`,done:d.realm_id>=6});
  if(d.realm_id<9)qs.push({txt:`达到 Lv9 解锁龙脉秘境`,done:d.realm_id>=9});
  if(d.breakthroughs<1)qs.push({txt:`完成首次突破`,done:d.breakthroughs>=1});
  if(!(rd.spirit_herb>0))qs.push({txt:`采集灵草`,done:rd.spirit_herb>0});
  $("quests").innerHTML=qs.map(q=>`<div class="quest-row"><span class="${q.done?'quest-done':'quest-pending'}">${q.done?'✓':'○'} ${q.txt}</span></div>`).join("");
  // Save indicator
  $("save-indicator").textContent="💾 已保存 · Tick "+_tick;
  // Auto-save every 10 ticks
  if(_tick - _saveTick >= 10){_saveTick=_tick;try{await P("/api/snapshot/take");$("save-indicator").textContent="💾 自动保存完成 · Tick "+_tick}catch(_){}}
}

async function cultivate(mode,useHerb){
  const r=await P("/api/game/cultivate",{mode,use_herb:useHerb});
  showMsg(r.msg||"",r.msg&&r.msg.includes("成功")?"success":r.msg&&r.msg.includes("失败")?"fail":r.msg&&r.msg.includes("入魔")?"warn":"info");
  if(r.breakthrough_ready){$("bt-panel").style.display="block";const b=(r.bonus||0)*100;$("bt-info").textContent=b>0?`已压制修为 +${b.toFixed(0)}%`:"选择突破时机";$("bt-chance").textContent=Math.round(30+b);$("bt-jade-chance").textContent=Math.round(50+b)}else{$("bt-panel").style.display="none"}
  refresh();
}
async function attemptBreakthrough(useJade){
  const r=await P("/api/game/breakthrough/attempt",{use_jade:useJade});
  showMsg(r.msg||"",r.success?"success":"fail");
  notify(r.success?"🎉 突破成功！境界提升！":"💥 突破失败！",r.success?"success":"danger");
  $("bt-panel").style.display="none";refresh();
}
async function explore(area){const r=await P("/api/game/explore",{area});notify(`📍 前往 ${AREA_NAMES[area]||area}`,"info");
  if(r.event){
    // Show event dialog with choices
    const e=r.event;
    let html=`<div style="background:var(--dark);border:2px solid var(--gold);border-radius:8px;padding:12px;margin:8px 0">`;
    html+=`<div style="color:var(--gold);font-weight:bold;font-size:14px">⚔ ${e.title}</div>`;
    html+=`<div style="color:var(--dim);font-size:11px;margin:4px 0">${e.description}</div>`;
    html+=`<div style="margin-top:8px">`;
    for(const c of e.choices){
      const riskLabel=c.success<0.5?"⚠":"";
      html+=`<button class="btn" style="margin:2px 0" onclick="resolveEvent('${e.eventId}','${c.id}')">${riskLabel}${c.label}</button>`;
    }
    html+=`</div></div>`;
    showMsg("",null);
    const old=$("areas");old.insertAdjacentHTML("beforebegin",html);
    notify(`⚔ ${e.title}`,"warn");
  }else{
    showMsg("踏入新区域...","info");
  }
  refresh()
}
async function resolveEvent(eventId,choiceId){
  const r=await P("/api/game/event/resolve",{eventId,choice:choiceId});
  const o=r.outcome;
  showMsg(o.message||"",o.success?"success":"fail");
  notify(o.success?"🎉 "+o.eventType+" 成功":"💥 "+o.eventType+" 失败",o.success?"success":"danger");
  refresh()
}
async function gather(res){const r=await P("/api/game/gather",{resource:res});notify(`🌿 获得 ${RES_NAMES[res]||res} ×${r.count}`,"success");refresh()}
async function rest(){const r=await P("/api/game/rest");showMsg(r.msg||"休息恢复中...","info");notify("🛌 休息恢复体力","info");refresh()}
async function foundSect(){const name=prompt("宗门名称",(pn?.textContent||"修士")+"宗");if(!name)return;const r=await P("/api/game/sect/found",{name});showMsg(r.msg||"",r.ok?"success":"fail");if(r.ok){$("bt-sect").style.display="none";notify("🏛 "+name+" 创立！","success")};refresh()}

// Shop panel
async function openShop(){const r=await G("/api/game/shop/list");if(!r.shop)return;let h=`<div style="background:var(--dark);border:1px solid var(--gold);border-radius:6px;padding:8px"><div style="color:var(--gold);margin-bottom:4px">${r.shop.name}</div>`;for(const i of r.shop.items){h+=`<div class="stat-row" style="margin:2px 0"><span>${i.name} (${i.quality})</span><span>${i.price}💰 <button class="btn" style="padding:2px 6px;font-size:10px" onclick="buyItem('${i.id}')">购买</button></span></div>`};h+=`</div>`;$("shop-panel").innerHTML=h;$("shop-panel").style.display="block";$("dialogue-panel").style.display="none";$("sect-panel").style.display="none"}
async function buyItem(id){const r=await P("/api/game/shop/buy",{item:id});showMsg(r.msg||"",r.ok?"success":"fail");refresh()}

// Dialogue
async function talkNPC(){const r=await P("/api/game/dialogue",{topic:"greeting"});$("dialogue-panel").innerHTML=`<div style="background:var(--dark);border:1px solid var(--realm);border-radius:6px;padding:8px"><span style="color:var(--realm)">${r.npc}:</span> ${r.text}</div>`;$("dialogue-panel").style.display="block";$("shop-panel").style.display="none";$("sect-panel").style.display="none"}

// Sect panel
async function openSect(){const r=await G("/api/game/sect/info");const s=r.sect;let h="";if(!s){h=`<div style="background:var(--dark);border:1px solid var(--gold);border-radius:6px;padding:8px"><div style="color:var(--dim)">未加入宗门</div><small style="color:var(--dim)">创立或加入宗门后显示详情</small></div>`}else{h=`<div style="background:var(--dark);border:1px solid var(--gold);border-radius:6px;padding:8px"><div style="color:var(--gold)">${s.name}</div><div>阶位:${s.rankName||s.rank} | 贡献:${s.contribution} | 成员:${s.memberCount}</div><div>时代:${s.era} | 实力:${s.power?.strength||0}</div><div style="margin-top:4px;font-size:10px;color:var(--dim)">任务:</div>`;const missions=[{id:"cultivate",name:"修炼"},{id:"patrol",name:"巡逻"},{id:"gather",name:"采集(需灵草x5)"}];for(const m of missions){h+=`<button class="btn" style="margin:2px;font-size:10px" onclick="sectMission('${m.id}')">${m.name}</button>`}h+=`</div>`};$("sect-panel").innerHTML=h;$("sect-panel").style.display="block";$("shop-panel").style.display="none";$("dialogue-panel").style.display="none"}
async function sectMission(type){const r=await P("/api/game/sect/mission",{mission:type});showMsg(r.ok?r.msg:r.error||"",r.ok?"success":"fail");refresh()}

// Exploration — new module
async function doExplore(area){
  const r=await P("/api/game/explore",{area});
  if(r.error){showMsg(r.error,"fail");return}
  showMsg(r.msg||"探索中...",r.type==="victory"?"success":r.type==="fight"?"warn":"info");
  if(r.type==="victory")notify("⚔ 击杀 "+r.monster.name+"！","warn");
  refresh()
}
async function doMove(area){
  const r=await P("/api/game/explore",{area,action:"move"});
  showMsg(r.msg||"进入区域...","info");
  refresh()
}
</script></body></html>
