<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Celestial — 修仙世界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#c8c8d0;font-family:"Courier New",monospace;height:100vh;display:flex;flex-direction:column}
#header{background:#111118;border-bottom:1px solid #333;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
#header span{color:#889}
#header .gold{color:#fa0}
#header .red{color:#e44}
#header .blue{color:#48f}
#output{flex:1;overflow-y:auto;padding:10px 14px;font-size:13px;line-height:1.7;white-space:pre-wrap}
.msg{padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.msg-system{color:#666;font-style:italic}
.msg-event{color:#fa0}
.msg-combat{color:#e44}
.msg-cultivate{color:#aaf}
.msg-item{color:#4f4}
.msg-weather{color:#99c}
.msg-npc{color:#f9a}
.msg-rumor{color:#888;font-style:italic}
.msg-milestone{color:#ff0;font-weight:bold}
.msg-danger{color:#f00;font-weight:bold}
#input-row{background:#111118;border-top:1px solid #333;padding:6px 14px;display:flex;gap:8px;align-items:center}
#btn-row{background:#111118;border-top:1px solid #222;padding:6px 14px;display:flex;gap:6px;flex-wrap:wrap}
.act-btn{background:rgba(255,255,255,0.06);color:#ccc;border:1px solid rgba(255,255,255,0.15);padding:6px 14px;font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.act-btn:hover{background:rgba(255,255,255,0.12);color:#fff}
.act-btn.cult{color:#aaf;border-color:rgba(100,100,255,0.4)}
.act-btn.rest{color:#8f8;border-color:rgba(100,255,100,0.4)}
.act-btn.explore{color:#fa0;border-color:rgba(255,170,0,0.4)}
.act-btn.combat{color:#e44;border-color:rgba(255,80,80,0.4)}
.act-btn.item{color:#4f4;border-color:rgba(80,255,80,0.4)}
.act-btn.info{color:#888;border-color:rgba(255,255,255,0.2)}
#input-row input{flex:1;background:transparent;border:none;color:#fff;font-family:inherit;font-size:13px;outline:none}
#input-row input::placeholder{color:#555}
#input-row button{background:#222;color:#aaa;border:1px solid #444;padding:5px 12px;font-family:inherit;font-size:12px;cursor:pointer}
#input-row button:hover{background:#333;color:#fff}
#status{background:#111118;border-top:1px solid #333;padding:4px 14px;font-size:11px;color:#555;display:flex;gap:15px}
</style></head><body>
<div id="header">
  <span>☯ <span id="name">云游道人</span> · <span class="gold" id="realm">炼气期</span> <span id="progress">0%</span></span>
  <span><span class="red">❤ <span id="hp">100/100</span></span> · <span class="blue">💠 <span id="qi">50/50</span></span> · ⚡<span id="stam">100</span></span>
</div>
<div id="output"></div>
<div id="status">
  <span id="tick">T0</span><span id="weather">晴</span><span id="area">翠竹林</span><span id="season">春</span><span>灵气:<span id="qiVal">1.0</span></span><span id="ents">0体</span>
</div>
<div id="btn-row">
  <button class="act-btn cult" onclick="doCmd('修炼')">🧘 修炼</button>
  <button class="act-btn explore" onclick="doCmd('探索')">🔍 探索</button>
  <button class="act-btn rest" onclick="doCmd('休息')">🛌 休息</button>
  <button class="act-btn item" onclick="doCmd('采集')">🌿 采集</button>
  <button class="act-btn combat" onclick="doCmd('突破')">💫 突破</button>
  <button class="act-btn info" onclick="doCmd('状态')">📋 状态</button>
  <button class="act-btn info" onclick="doCmd('世界')">🌍 世界</button>
</div>
<div id="input-row">
  <span style="color:#888">▸</span>
  <input id="cmd" placeholder="其他命令...">
  <button onclick="sendCmd()">↵</button>
</div>
<script>
const B='http://localhost:3000';
const out=document.getElementById('output');
const cmd=document.getElementById('cmd');

let playerData=null,worldState={tick:0};

function doCmd(action){
  cmd.value=action;
  sendCmd();
}

function log(msg,cls=''){
  const d=document.createElement('div');d.className='msg'+(cls?' '+cls:'');
  d.textContent=msg;out.appendChild(d);out.scrollTop=out.scrollHeight;
  if(out.children.length>200)out.removeChild(out.children[0]);
}

function updateHUD(p){
  if(!p)return;
  playerData=p;
  document.getElementById('hp').textContent=(p.hp_current||100)+'/'+(p.hp_max||100);
  document.getElementById('qi').textContent=(p.qi_current||p.qi||50)+'/'+(p.qi_max||50);
  document.getElementById('stam').textContent=p.stam_current||p.stamina_current||0;
  const realms=['凡人','炼气期','筑基期','金丹期','元婴期','化神期','渡劫期'];
  document.getElementById('realm').textContent=realms[p.realm_id||1]||'炼气期';
  document.getElementById('progress').textContent=Math.round((p.cultivation||p.progress||0)*100)+'%';
  document.getElementById('name').textContent=p.name||'云游道人';
}

const P=(p,d)=>fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})}).then(r=>r.json());
const G=p=>fetch(B+p).then(r=>r.json());

async function refresh(){
  const w=await G('/api/world');
  if(w){
    worldState=w;
    document.getElementById('tick').textContent='T'+w.tick;
    document.getElementById('ents').textContent=w.entities+'体';
    const wInfo=w.weather?w.weather.get?.('world'):null;
    document.getElementById('weather').textContent=wInfo||'晴';
    document.getElementById('qiVal').textContent=(w.qi||1).toFixed(2);
  }
  const p=await G('/api/game/player');
  if(p&&p.player){updateHUD(p.player);document.getElementById('area').textContent=p.player.current_area||'翠竹林'}
}

async function sendCmd(){
  const text=cmd.value.trim();cmd.value='';
  if(!text)return;
  log('▸ '+text,'msg-system');

  const parts=text.split(/\s+/);
  const action=parts[0];

  try{
    switch(action){
      case '修炼': case 'cultivate':{
        const mode=parts[1]||'risky';
        const r=await P('/api/game/cultivate',{mode});
        if(r.ok)log(`🧘 ${r.msg}`,r.breakthrough_ready?'msg-milestone':'msg-cultivate');
        else log(`⚠ ${r.msg}`,'msg-system');
        break;
      }
      case '休息': case 'rest':{
        const r=await P('/api/game/rest');
        log(`🛌 ${r.msg||'恢复体力'}`,r.ok?'msg-cultivate':'msg-system');
        break;
      }
      case '探索': case 'explore':{
        const area=parts[1]||'area_bamboo_grove';
        const r=await P('/api/game/explore',{area:area.startsWith('area_')?area:'area_'+area});
        if(r.type==='fight')log(`⚔ ${r.monster?.name||'怪物'}出现！造成${r.playerDmg}伤害，受${r.monsterDmg}伤`,part[1]==='victory'?'msg-combat':'msg-combat');
        else if(r.type==='victory')log(`💀 击杀${r.monster?.name}！掉落: ${(r.loot||[]).join(' ')}`,'msg-item');
        else log(`${r.msg||'探索中...'} [第${r.step||'?'}步]`,r.milestone?'msg-milestone':'msg-event');
        break;
      }
      case '采集': case 'gather':{
        const r=await P('/api/game/alchemy/gather',{herb:parts[1]||'spirit_grass'});
        log(r.empty?'未找到灵草':'🌿 采集 '+r.herb+' +1','msg-item');
        break;
      }
      case '突破': case 'breakthrough':{
        const r=await P('/api/game/breakthrough');
        log(r.ok?`💫 ${r.msg||'突破成功！'}`:`❌ ${r.msg||r.error||'突破失败'}`,'msg-milestone');
        break;
      }
      case '状态': case 'status': case '查看':{
        const p=await G('/api/game/player');
        const d=p.player||p;
        if(d){
          log(`═══ 修士状态 ═══`,'msg-system');
          log(`姓名: ${d.name||'无名'}  |  境界: ${document.getElementById('realm').textContent}`,'msg-system');
          log(`功法: ${d.method||'基础吐纳'}  |  灵根: ${d.spirit_root||'未知'}`,'msg-system');
          log(`体力: ${d.stam_current||d.stamina_current||0}  |  探索次数: ${d.explored||0}`,'msg-system');
          const inv=d.inventory||d.items||{};
          const names={spirit_herb:'灵草',jade_shard:'灵石碎片',spirit_stone:'灵石',ancient_jade:'古玉',dragon_scale:'龙鳞',thunder_ore:'雷晶'};
          const items=Object.entries(inv).filter(([,v])=>v>0).map(([k,v])=>`${names[k]||k} ×${v}`);
          if(items.length)log(`🎒 背包: ${items.join(' | ')}`,'msg-item');
          else log('🎒 背包: 空空如也','msg-system');
        }
        break;
      }
      case '世界': case 'world':{
        const w=await G('/api/world');
        const qiTide=await G('/api/world/qi-tide').catch(()=>({}));
        log(`═══ 世界状态 ═══`,'msg-system');
        log(`Tick: ${w.tick}  |  灵气: ${(w.qi||1).toFixed(2)}  |  天气: ${w.weather||'晴'}`,'msg-event');
        log(`实体: ${w.entities}  |  NPC: ${w.npcs||0}  |  灵潮: ${qiTide.tide||'正常'}`,'msg-system');
        const npcs=await G('/api/npcs');
        if(Array.isArray(npcs)){
          log(`活跃修士: ${npcs.length}人`,'msg-npc');
          for(const n of npcs.slice(0,5)){
            log(`  ${n.name||'无名修士'} · ${n.realm||'??'} · ${n.area||'??'}`,'msg-npc');
          }
        }
        break;
      }
      case '帮助': case 'help':{
        log(`═══ 可用命令 ═══`,'msg-system');
        log(`修炼|休息|探索|采集|突破|状态|世界|帮助`,'msg-system');
        log(`探索 <区域>  — 探索特定区域 (翠竹林/云雾峰/雷音谷/龙脉)`,'msg-system');
        log(`采集 <灵草名> — spirit_grass / fire_flower / frost_lotus`,'msg-system');
        break;
      }
      default:
        log(`未知命令: ${action}。输入 "帮助" 查看可用命令。`,'msg-system');
    }
  }catch(e){log(`错误: ${e.message}`,'msg-danger')}
  await refresh();
}

cmd.addEventListener('keydown',e=>{if(e.key==='Enter')sendCmd()});

(async()=>{
  const p=await G('/api/game/player');
  if(!p.player||!p.player.name){await P('/api/game/player/create',{name:'云游道人'});log('☯ 新修士降临...','msg-event')}
  await refresh();
  log('═══════════════════════════════','msg-system');
  log('  欢迎来到修仙世界','msg-milestone');
  log('  输入"帮助"查看可用命令','msg-system');
  log('═══════════════════════════════','msg-system');
  // World news
  const w=await G('/api/world');
  log(`📰 天历${w.year||'?'}年 · ${w.season||'春'}季 · 世界Tick ${w.tick}`,'msg-weather');
  log(`🌿 灵气密度: ${(w.qi||1).toFixed(2)}  ·  活跃实体: ${w.entities}`,'msg-weather');
})();
setInterval(refresh,8000);
</script></body></html>
