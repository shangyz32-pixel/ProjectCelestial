# 势力详述
#
# 基于 Registry/factions.yaml 的六大势力类型，
# 为当前叙事世界中的三大核心势力提供完整设定。
#
# 与 NPC 记忆交叉验证：所有细节必须与已有 memory.yaml 一致。

version: "1.0"
status: Canon

---

# ============================================================
# 青云宗
# ============================================================

faction_qingyun:

  name: "青云宗"
  type: "宗门"
  founded: "天历 500 年"
  founder: "青云真人（已飞升）"
  slogan: "青云直上，道法自然"

  location:
    headquarters: "青云山脉·青云峰"
    territory: "青云山脉方圆三千里"
    description: >
      坐落于大陆东部的青云山脉主峰。山门高三千丈，
      终年云雾缭绕，灵气浓度是外界的三倍。
      山顶有青云真人飞升时留下的登仙台遗迹。

  hierarchy:
    - rank: "宗主"
      title: "青云宗宗主"
      current: "玄真子（化神境巅峰）"
      power: "名义最高，实际被大长老一系牵制"

    - rank: "大长老"
      title: "执法大长老"
      current: "公孙烈（化神境中期）"
      power: "实际掌权者。二十年前主导驱逐陈玄。"
      faction: "保守派——维护宗门颜面高于一切"

    - rank: "内门长老"
      title: "传功长老 / 执法长老 / 丹堂长老"
      current_example: "李长风（化神境）"
      power: "各司其职，但在重大事务上需听大长老"
      note: "李长风曾是宗主候选人，因陈玄事件失势，被架空"

    - rank: "内门弟子"
      count: "约 200 人"
      requirement: "金丹境以上 或 天灵根"
      privilege: "独立洞府、月俸灵石、丹药配给"

    - rank: "外门弟子"
      count: "约 2000 人"
      requirement: "筑基境以上"
      privilege: "集体修炼场、基础丹药"
      current_example: "王虎（金丹境，正在晋升内门）"

  culture:
    values:
      - "正统——青云宗自认修仙界正宗，看不起散修和旁门"
      - "颜面——宗门声誉高于个体正义（这也是包庇王虎的根源）"
      - "传承——重视功法传承，排斥外来功法（陈玄的焚天诀即为禁忌）"

    internal_conflict:
      description: >
        保守派（大长老公孙烈）与改革派（以李长风为代表的少数长老）
        之间的裂缝正在扩大。公孙烈认为维护宗门颜面高于一切，
        即使包庇王虎这样的败类也在所不惜。李长风则主张正道宗门
        应当有底线——但他的声音已经太微弱了。
      trigger_point: >
        王虎晋升内门一事可能成为引爆点。
        如果陈玄在外面对王虎动手，青云宗必须选边站。

  current_conflicts:
    - target: "散修盟"
      nature: "敌对（非正式）"
      cause: "陈玄的个人恩怨 → 两派对立"
      intensity: 6

    - target: "魔渊"
      nature: "敌对（正式）"
      cause: "正邪对立"
      intensity: 5

---

# ============================================================
# 散修盟
# ============================================================

faction_sanxiumeng:

  name: "散修盟"
  type: "联盟"
  founded: "天历 837 年"
  founder: "陈玄"
  slogan: "不受宗门之辱，不跪世家之门"

  location:
    headquarters: "东海之滨·散修崖"
    territory: "东海沿岸五百里"
    description: >
      一座临海的石崖，崖壁上刻着入盟誓言。
      没有宗门的高墙大殿，只有几排石屋和一个议事厅。
      海风吹过时，崖壁上的刻字会发出低沉的嗡鸣。

  hierarchy:
    - rank: "盟主"
      current: "陈玄（元婴境）"
      power: "绝对权威。不是靠规矩，是靠实力和创立者的威望。"
      note: "陈玄平时不管日常事务，由执事代管。"

    - rank: "执事"
      count: "3 人"
      current: "三位金丹境散修"
      duty: "日常管理、资源分配、新人引导"

    - rank: "正式成员"
      count: "约 50 人"
      composition: "大多是被宗门排斥或不愿受宗门约束的散修"
      identity: "不以师门相称，互称'道友'"

    - rank: "弟子"
      count: "约 10 人"
      current_example: "赵灵儿（筑基境，冰凤灵体）"

  culture:
    values:
      - "自由——天底下最贵的东西。散修盟不卖它。"
      - "互助——一个人走不远。散修盟是'一起走'的意思。"
      - "尊严——你可以境界低，但你不比任何宗门弟子矮一头。"

    founding_myth: >
      散修盟有一个广为流传的故事：
      盟主陈玄曾是青云宗最有前途的内门弟子，
      因为不肯交出自己得到的功法，被诬陷"勾结魔道"逐出师门。
      他在外流浪十年，走遍九州四海，
      最后在东海边创立了散修盟。
      
      这个故事每个新成员入盟时都会听到。
      但陈玄自己从不讲。

  current_conflicts:
    - target: "青云宗"
      nature: "敌对（冷对抗）"
      cause: "陈玄被逐 + 林远被杀 + 青云宗包庇王虎"
      intensity: 7
      recent: "陈玄拒绝了青云宗的'和解'邀请"

---

# ============================================================
# 魔渊
# ============================================================

faction_moyuan:

  name: "魔渊"
  type: "魔教"
  founded: "不详"
  founder: "不详（传说为上古魔尊残魂所化）"

  location:
    headquarters: "未知（传说在地下极深处）"
    territory: "大陆西部的黑域，以及各地的暗桩"
    description: >
      魔渊并非一个统一的组织，而是多个魔道势力的松散联盟。
      它们共享一个信念：天道不公，正道伪善，唯力量为真。

  hierarchy:
    - rank: "魔尊"
      current: "未知（据说已沉睡千年）"
      note: "魔渊各方势力各自为政，魔尊更像一个象征"

    - rank: "魔将"
      count: "七位"
      description: "七大魔道势力的首领，各据一方"
      known: "其中一位魔将曾派人覆灭赵家堡，夺取冰凤灵体"

  culture:
    values:
      - "力量即真理——什么正邪对错，活下来的人说了算。"
      - "仇恨驱动——很多魔修原本是正道弃徒，怀着对正道的刻骨仇恨入魔。"
      - "不择手段——只要能变强，功法、丹药、人命皆可为资源。"

  modus_operandi:
    description: >
      魔渊不发动正面战争。它们渗透、收买、暗杀，
      专挑正道宗门的内部分裂下手。
      赵家堡覆灭的剧本很简单：
      得知冰凤灵体 → 派暗桩确认 → 一夜屠尽 → 掳走灵体。
      等正道宗门反应过来，魔渊的人已经消失在地下深处。

  current_conflicts:
    - target: "青云宗"
      nature: "敌对（正式正邪对立）"
      intensity: 5

    - target: "赵家堡（已灭）"
      nature: "屠杀"
      cause: "冰凤灵体"
      date: "天历 845 年"
      status: "已完成。灵体（赵灵儿）逃脱，仍在搜寻中。"

  narrative_potential:
    - "赵灵儿的冰凤灵体是魔渊想要的东西 → 散修盟保护她 → 冲突点"
    - "魔渊与青云宗的正邪对立 → 如果陈玄与魔渊合作对抗青云宗？→ 道德困境"
    - "陈玄被青云宗诬陷'勾结魔道' → 二十年后，他会不会真的被逼到那一步？"
