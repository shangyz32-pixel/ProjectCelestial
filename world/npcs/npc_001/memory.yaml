      from: "npc_002"
      to: "npc_linyuan"

  - id: 104
    timestamp: "天历 840 年 5 月 20 日"
    type: cultivation
    title: "突破元婴境"
    narrative: >
      在东海孤岛上苦修三年，以散修之身渡过天劫，
      踏入元婴境。天劫九道天雷，陈玄以火属性功法硬抗通过。
      元婴凝结之日，东海潮涌百丈。
    importance: 8
    location: "东海·无名孤岛"
    emotional_valence: +9
    behavior_tags:
      - tag: CONFIDENT
        target: ""
        intensity: 8
        decay: slow_decay
      - tag: DETERMINED
        target: ""
        intensity: 8
        decay: slow_decay

  - id: 105
    timestamp: "天历 830 年 12 月 3 日"
    type: discovery
    title: "获得上古功法《焚天诀》"
    narrative: >
      流浪途中误入一处古修洞府，在石壁中得到完整的上古火属性功法《焚天诀》。
      此功法正是当年青云宗长老图谋之物。
      陈玄悟出其核心奥义：焚天先焚己，不破不立。
    importance: 8
    location: "古修洞府·赤焰谷"
    emotional_valence: +8
    behavior_tags:
      - tag: SEEKS_MASTERY
        target: ""
        intensity: 7
        decay: slow_decay

