# ============================================================
# 短期记忆（最近 30 世界日）
# ============================================================
short_term:

  - id: 1
    timestamp: "天历 847 年 7 月 23 日"
    type: social
    title: "坊市遇见王虎"
    narrative: >
      在云来坊市采买丹药时，远远看见王虎从灵宝阁出来。
      他正与掌柜谈笑风生，腰间挂着当年抢走的青冥剑。
      陈玄压制住出手的冲动，隐入人群。
    importance: 8
    participants:
      - entity_id: "npc_002"
        entity_type: character
        role: target
    location: "云来坊市·灵宝阁"
    emotional_valence: -8
    behavior_tags:
      - tag: HOSTILE_TOWARD
        target: "npc_002"
        intensity: 9
        decay: slow_decay
      - tag: SEEKS_REVENGE
        target: ""
        intensity: 8
        decay: slow_decay
      - tag: FEARFUL_OF
        target: "faction_qingyun"
        intensity: 5
        decay: medium_decay
    kg_trigger:
      action: update
      edge_type: RIVAL_OF
      from: "npc_001"
      to: "npc_002"

  - id: 2
    timestamp: "天历 847 年 7 月 20 日"
    type: cultivation
    title: "炼制破婴丹成功"
    narrative: >
      闭关七日，终于炼成一炉三枚破婴丹。
      丹成时有红光冲霄，被附近小宗门察觉。
    importance: 6
    location: "散修盟·丹房"
    emotional_valence: +7
    behavior_tags:
      - tag: CONFIDENT
        target: ""
        intensity: 6
        decay: medium_decay

  - id: 3
    timestamp: "天历 847 年 7 月 15 日"
    type: social
    title: "拒绝青云宗密使"
    narrative: >
      青云宗遣密使前来，以"当年之事已成过往"为由，
      邀陈玄回宗门任客卿长老。陈玄冷笑拒绝。
    importance: 5
    participants:
      - entity_id: "faction_qingyun"
        entity_type: faction
        role: proposer
    location: "散修盟·议事厅"
    emotional_valence: -4
    behavior_tags:
      - tag: SUSPICIOUS_OF
        target: "faction_qingyun"
        intensity: 7
        decay: medium_decay

  - id: 4
    timestamp: "天历 847 年 7 月 12 日"
    type: resource
    title: "采购炼丹材料"
    narrative: >
      从常驻商人处购得三株火灵芝、五两龙血石。
      价格比上月上涨两成，据说是魔渊侵扰商路所致。
    importance: 2
    location: "云来坊市"
    emotional_valence: 0

  - id: 5
    timestamp: "天历 847 年 7 月 8 日"
    type: social
    title: "新收弟子赵灵儿"
    narrative: >
      在荒山遇到被妖兽追杀的少女赵灵儿，出手相救。
      发现她是罕见的冰凤灵体，资质极高，遂收为弟子。
    importance: 7
    participants:
      - entity_id: "npc_003"
        entity_type: character
        role: rescued
    location: "荒山·黑风岭"
    emotional_valence: +8
    behavior_tags:
