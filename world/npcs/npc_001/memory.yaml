long_term:

  - id: 101
    timestamp: "天历 827 年 3 月 15 日"
    type: faction
    title: "被青云宗逐出师门"
    narrative: >
      陈玄原是青云宗内门弟子，因不愿交出偶然得到的上古功法残卷，
      被长老诬陷"勾结魔道"，当众逐出师门。
      师父李长老在旁沉默不语，未替他说一句话。
      离山那日大雨倾盆，陈玄发誓此生不再入青云宗一步。
    importance: 10
    participants:
      - entity_id: "faction_qingyun"
        entity_type: faction
        role: expeller
      - entity_id: "npc_master_li"
        entity_type: character
        role: silent_witness
    location: "青云宗·山门"
    emotional_valence: -10
    behavior_tags:
      - tag: HOSTILE_TOWARD
        target: "faction_qingyun"
        intensity: 10
        decay: permanent
      - tag: BETRAYED_BY
        target: "faction_qingyun"
        intensity: 9
        decay: permanent
      - tag: SEEKS_POWER
        target: ""
        intensity: 9
        decay: slow_decay
      - tag: TRAUMATIZED
        target: ""
        intensity: 7
        decay: permanent
    kg_trigger:
      action: create
      edge_type: HOSTILE_TO
      from: "npc_001"
      to: "faction_qingyun"

  - id: 102
    timestamp: "天历 837 年 6 月 1 日"
    type: faction
    title: "创立散修盟"
    narrative: >
      流浪十年，走遍九州四海，在元婴境大成之后，
      于东海之滨聚集了一批无门无派的散修，
      创立散修盟。盟约只有一条：
      "不受宗门之辱，不跪世家之门。"
    importance: 9
    participants:
      - entity_id: "faction_sanxiumeng"
        entity_type: faction
        role: founder
    location: "东海·散修盟"
    emotional_valence: +9
    behavior_tags:
      - tag: LOYAL_TO
        target: "faction_sanxiumeng"
        intensity: 10
        decay: permanent
      - tag: CONFIDENT
        target: ""
        intensity: 7
        decay: slow_decay
    kg_trigger:
      action: create
      edge_type: LEADS
      from: "npc_001"
      to: "faction_sanxiumeng"

  - id: 103
    timestamp: "天历 844 年 9 月 11 日"
    type: death
    title: "爱徒林远被王虎所杀"
    narrative: >
      大弟子林远外出历练时遭遇青云宗外门弟子王虎。
      王虎觊觎林远身上的法宝，设伏偷袭将其杀害，
      夺走青冥剑。陈玄赶到时为时已晚，只带回林远遗体。
      青云宗以"私人恩怨"为由拒绝交出王虎。
    importance: 10
    participants:
      - entity_id: "npc_002"
        entity_type: character
        role: killer
      - entity_id: "npc_linyuan"
        entity_type: character
        role: victim
      - entity_id: "faction_qingyun"
        entity_type: faction
        role: protector
    location: "青云山脉·断魂崖"
    emotional_valence: -10
    behavior_tags:
      - tag: HOSTILE_TOWARD
        target: "npc_002"
        intensity: 10
        decay: permanent
      - tag: SEEKS_REVENGE
        target: "npc_002"
        intensity: 10
        decay: permanent
