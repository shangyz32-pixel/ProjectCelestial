# ============================================================
# 行为推理演示
# ============================================================
#
# 场景：陈玄在坊市遇见王虎
# → on_encounter pipeline 触发
# → scan_memory 匹配到 target=npc_002 的 active_tags:
#     HOSTILE_TOWARD: 10
#     SEEKS_REVENGE: 10
# → decide_behavior:
#     HOSTILE_TOWARD intensity 10 >= 7 → attack
#     但地点为坊市（中立区，有守卫）
#     陈玄 personality 取 "隐忍型"
#     → 最终行为：不立即出手，跟踪王虎，等待独处时机
#
# 这就是记忆驱动行为——不是"突然想打架"，
# 而是 20 年被逐 + 3 年丧徒 + 今天重逢 共同作用的结果。
