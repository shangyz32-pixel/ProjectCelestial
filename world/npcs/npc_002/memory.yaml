# NPC Memory: 王虎（夺剑者）
#
# 与陈玄 (npc_001) 共享事件：天历844年杀林远、天历847年坊市相遇
# 视角：施害者——不认为自己做错了什么

npc_id: "npc_002"
npc_name: "王虎"
realm: "金丹境"
