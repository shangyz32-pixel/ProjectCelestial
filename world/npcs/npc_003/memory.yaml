short_term:

  - id: 1
    timestamp: "天历 847 年 7 月 20 日"
    type: cultivation
    title: "师父传授基础心法"
    narrative: >
      师父今天开始教我散修盟的基础心法《归元诀》。
      他说我的冰凤灵体极为罕见，普通心法可能不够，
      他正在想办法帮我找适合冰属性的功法。
      师父看起来总是很严肃，但教我时很耐心。
      他的眼睛里有一种……我说不清的东西。
      像是远处有火在烧。
    importance: 5
    participants:
      - entity_id: "npc_001"
        entity_type: character
        role: teacher
    location: "散修盟·练功房"
    emotional_valence: +6
    behavior_tags:
      - tag: TRUSTS
        target: "npc_001"
        intensity: 7
        decay: medium_decay
      - tag: GRATEFUL_TOWARD
        target: "npc_001"
        intensity: 8
        decay: medium_decay

  - id: 2
    timestamp: "天历 847 年 7 月 15 日"
    type: social
    title: "听师兄们说起师父的往事"
    narrative: >
      散修盟的老弟子们私下聊天时提到：
      "盟主当年是被青云宗赶出来的。"
      "他那个大弟子林远可是个天才……可惜了。"
      看到我走近，他们立刻闭嘴不说了。
      林远是谁？师父从没提过。
    importance: 4
    participants:
      - entity_id: "npc_001"
        entity_type: character
        role: subject
    location: "散修盟·饭堂"
    emotional_valence: -2
    behavior_tags:
      - tag: SUSPICIOUS_OF
        target: "faction_qingyun"
        intensity: 3
        decay: fast_decay

  - id: 3
    timestamp: "天历 847 年 7 月 12 日"
    type: discovery
    title: "第一次感受到冰凤灵体的力量"
    narrative: >
      夜里独自修炼时，无意中触发了冰凤灵体。
      周身三丈尽皆凝霜，一只虚幻的冰凤虚影在背后展开。
      师父被惊动赶来，看了很久，说了一句：
      "灵儿，你的路会比我的更长。"
      我不太懂这句话的意思。
    importance: 7
    participants:
      - entity_id: "npc_001"
        entity_type: character
        role: witness
    location: "散修盟·后山"
    emotional_valence: +8
    behavior_tags:
      - tag: CONFIDENT
        target: ""
        intensity: 6
        decay: medium_decay
      - tag: SEEKS_MASTERY
        target: ""
        intensity: 7
        decay: slow_decay

