long_term:

  - id: 101
    timestamp: "天历 847 年 7 月 8 日"
    type: battle
    title: "黑风岭遇袭，被师父所救"
    narrative: >
      独自穿越黑风岭时遭遇三只金瞳妖狼。
      筑基境的自己根本不是对手，被逼到绝路。
      就在妖狼扑上来的瞬间，一道火焰从天而降——
      一个中年修士挡在身前，一掌击退三狼。
      他什么也没说，检查了我的伤势，发现我有冰凤灵体后，
      沉默了很久才开口："跟我走。"
      那一刻我第一次觉得安全。
    importance: 10
    participants:
      - entity_id: "npc_001"
        entity_type: character
        role: rescuer
    location: "荒山·黑风岭"
    emotional_valence: +10
    behavior_tags:
      - tag: GRATEFUL_TOWARD
        target: "npc_001"
        intensity: 10
        decay: permanent
      - tag: TRUSTS
        target: "npc_001"
        intensity: 10
        decay: permanent
      - tag: LOYAL_TO
        target: "faction_sanxiumeng"
        intensity: 8
        decay: slow_decay
    kg_trigger:
      action: create
      edge_type: SAVED
      from: "npc_001"
      to: "npc_003"

  - id: 102
    timestamp: "天历 845 年 2 月 14 日"
    type: death
    title: "家族覆灭"
    narrative: >
      赵家本是小修仙家族，因族中出了冰凤灵体，
      引来魔渊觊觎。一夜之间家族被灭，
      只有赵灵儿被母亲藏在地窖中逃过一劫。
      从那以后她独自流浪了两年，直到遇见师父。
      她其实知道失去一切的滋味。
      所以师父眼里的火焰，她觉得熟悉。
    importance: 9
    participants: []
    location: "赵家堡"
    emotional_valence: -10
